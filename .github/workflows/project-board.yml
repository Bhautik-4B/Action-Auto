name: Project board copy

# A copy of the owner's GitHub Projects board (users/4BornGithub/projects/31),
# read with the PROJECTS_TOKEN secret and saved into the private repository
# (branch "board": board.json and board.md), where the coding sessions can read
# it. This repository is public: nothing of the board is printed in this log.
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      add:
        description: "Also add the cards in todo.json (private repository, branch board) as Todo items"
        type: boolean
        default: false
      status:
        description: "Set each card's Status from status.json (private repository, branch board): title -> progress / todo / done"
        type: boolean
        default: false
      convert:
        description: "Turn every draft card into an issue of 4BornGithub/4B-Rummy-Home (assigned to Bhautik-4B)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: project-board
  cancel-in-progress: false

env:
  PRIVATE_REPO: Bhautik-4B/Game-Auto
  BOARD_OWNER: 4BornGithub
  BOARD_NUMBER: "31"
  ISSUE_REPO: 4BornGithub/4B-Rummy-Home   # where the cards become issues

jobs:
  copy:
    name: copy the board
    runs-on: ubuntu-latest
    steps:
      - name: Add the cards from todo.json
        if: ${{ inputs.add }}
        env:
          TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ASSIGNEE: Bhautik-4B
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch board "https://x-access-token:${REPO_TOKEN}@github.com/${PRIVATE_REPO}.git" "$RUNNER_TEMP/src"
          cat > "$RUNNER_TEMP/add.py" <<'PY'
          import json, os, sys, urllib.request
          token = os.environ["TOKEN"]; owner = os.environ["BOARD_OWNER"]; number = int(os.environ["BOARD_NUMBER"])
          def gql(q, v):
              req = urllib.request.Request("https://api.github.com/graphql", data=json.dumps({"query": q, "variables": v}).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          d = gql("""query($login: String!, $number: Int!, $who: String!) {
            user(login: $login) { projectV2(number: $number) { id
              fields(first: 50) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } }
              } }
            who: user(login: $who) { id } }""", {"login": owner, "number": number, "who": os.environ["ASSIGNEE"]})
          if d.get("errors"): print("Read errors:", [e.get("type") for e in d["errors"]]); sys.exit(1)
          proj = d["data"]["user"]["projectV2"]; who = (d["data"].get("who") or {}).get("id")
          status = next((f for f in proj["fields"]["nodes"] if f and f.get("name", "").lower() == "status"), None)
          todo = next((o for o in (status or {}).get("options", []) if o["name"].lower().replace(" ", "") == "todo"), None)
          print("Status field:", bool(status), "Todo option:", bool(todo), "assignee found:", bool(who))
          # Every item of the board, page by page (the board has more than 100 items; reading
          # only the first 100 left new cards as drafts, without a status, or added them twice).
          def all_items(fields):
              out, after = [], None
              while True:
                  r = gql("""query($login: String!, $number: Int!, $after: String) { user(login: $login) { projectV2(number: $number) {
                      items(first: 100, after: $after) { pageInfo { hasNextPage endCursor } nodes { %s } } } } }""" % fields,
                      {"login": owner, "number": number, "after": after})
                  if r.get("errors"): print("Read errors:", [e.get("type") for e in r["errors"]]); sys.exit(1)
                  page = r["data"]["user"]["projectV2"]["items"]
                  out += page["nodes"]
                  if not page["pageInfo"]["hasNextPage"]: return out
                  after = page["pageInfo"]["endCursor"]
          have = {(n.get("content") or {}).get("title") for n in all_items("content { ... on DraftIssue { title } ... on Issue { title } ... on PullRequest { title } }")}
          cards = json.load(open(os.environ["RUNNER_TEMP"] + "/src/todo.json"))
          added = skipped = noassign = 0
          M = """mutation($p: ID!, $t: String!, $b: String, $a: [ID!]) {
            addProjectV2DraftIssue(input: {projectId: $p, title: $t, body: $b, assigneeIds: $a}) { projectItem { id } } }"""
          for c in cards:
              if c["title"] in have: skipped += 1; continue
              r = gql(M, {"p": proj["id"], "t": c["title"], "b": c["body"], "a": [who] if who else []})
              if r.get("errors") and who:
                  noassign += 1
                  r = gql(M, {"p": proj["id"], "t": c["title"], "b": c["body"], "a": []})
              if r.get("errors"): print("Add errors:", [e.get("type") for e in r["errors"]]); sys.exit(1)
              item = r["data"]["addProjectV2DraftIssue"]["projectItem"]["id"]
              if status and todo:
                  u = gql("""mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                    updateProjectV2ItemFieldValue(input: {projectId: $p, itemId: $i, fieldId: $f, value: {singleSelectOptionId: $o}}) { projectV2Item { id } } }""",
                    {"p": proj["id"], "i": item, "f": status["id"], "o": todo["id"]})
                  if u.get("errors"): print("Status errors:", [e.get("type") for e in u["errors"]]); sys.exit(1)
              added += 1
          print(f"Cards added: {added}, already there: {skipped}, added without assignee: {noassign}")
          PY
          python3 "$RUNNER_TEMP/add.py"

      - name: Turn draft cards into issues
        if: ${{ inputs.convert }}
        env:
          TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ASSIGNEE: Bhautik-4B
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/convert.py" <<'PY'
          import json, os, sys, urllib.request
          token = os.environ["TOKEN"]; owner = os.environ["BOARD_OWNER"]; number = int(os.environ["BOARD_NUMBER"])
          ro, rn = os.environ["ISSUE_REPO"].split("/")
          def gql(q, v):
              req = urllib.request.Request("https://api.github.com/graphql", data=json.dumps({"query": q, "variables": v}).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          d = gql("""query($login: String!, $number: Int!, $ro: String!, $rn: String!, $who: String!) {
            user(login: $login) { projectV2(number: $number) { id } }
            repository(owner: $ro, name: $rn) { id }
            who: user(login: $who) { id } }""", {"login": owner, "number": number, "ro": ro, "rn": rn, "who": os.environ["ASSIGNEE"]})
          if d.get("errors"): print("Read errors:", [e.get("type") for e in d["errors"]]); sys.exit(1)
          repo = (d["data"].get("repository") or {}).get("id"); who = (d["data"].get("who") or {}).get("id")
          if not repo: print("The issue repository is not reachable with PROJECTS_TOKEN"); sys.exit(1)
          # Every item of the board, page by page (the board has more than 100 items; reading
          # only the first 100 left new cards as drafts, without a status, or added them twice).
          def all_items(fields):
              out, after = [], None
              while True:
                  r = gql("""query($login: String!, $number: Int!, $after: String) { user(login: $login) { projectV2(number: $number) {
                      items(first: 100, after: $after) { pageInfo { hasNextPage endCursor } nodes { %s } } } } }""" % fields,
                      {"login": owner, "number": number, "after": after})
                  if r.get("errors"): print("Read errors:", [e.get("type") for e in r["errors"]]); sys.exit(1)
                  page = r["data"]["user"]["projectV2"]["items"]
                  out += page["nodes"]
                  if not page["pageInfo"]["hasNextPage"]: return out
                  after = page["pageInfo"]["endCursor"]
          drafts = [n["id"] for n in all_items("id type") if n["type"] == "DRAFT_ISSUE"]
          done = 0
          for item in drafts:
              r = gql("""mutation($i: ID!, $r: ID!) { convertProjectV2DraftIssueItemToIssue(input: {itemId: $i, repositoryId: $r}) {
                item { content { ... on Issue { id assignees(first: 5) { totalCount } } } } } }""", {"i": item, "r": repo})
              if r.get("errors"): print("Convert errors:", [e.get("type") for e in r["errors"]]); sys.exit(1)
              issue = r["data"]["convertProjectV2DraftIssueItemToIssue"]["item"]["content"]
              if who and issue["assignees"]["totalCount"] == 0:
                  a = gql("""mutation($a: ID!, $u: [ID!]!) { addAssigneesToAssignable(input: {assignableId: $a, assigneeIds: $u}) { clientMutationId } }""",
                          {"a": issue["id"], "u": [who]})
                  if a.get("errors"): print("Assign errors:", [e.get("type") for e in a["errors"]])
              done += 1
          print(f"Draft cards turned into issues: {done} of {len(drafts)}")
          PY
          python3 "$RUNNER_TEMP/convert.py"

      - name: Set the cards' status
        if: ${{ inputs.status }}
        env:
          TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/st" && git clone -q --depth 1 --branch board "https://x-access-token:${REPO_TOKEN}@github.com/${PRIVATE_REPO}.git" "$RUNNER_TEMP/st"
          cat > "$RUNNER_TEMP/status.py" <<'PY'
          import json, os, sys, urllib.request
          token = os.environ["TOKEN"]; owner = os.environ["BOARD_OWNER"]; number = int(os.environ["BOARD_NUMBER"])
          def gql(q, v):
              req = urllib.request.Request("https://api.github.com/graphql", data=json.dumps({"query": q, "variables": v}).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          d = gql("""query($login: String!, $number: Int!) { user(login: $login) { projectV2(number: $number) { id
              fields(first: 50) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } }
              } } }""",
              {"login": owner, "number": number})
          if d.get("errors"): print("Read errors:", [e.get("type") for e in d["errors"]]); sys.exit(1)
          proj = d["data"]["user"]["projectV2"]
          status = next((f for f in proj["fields"]["nodes"] if f and f.get("name", "").lower() == "status"), None)
          if not status: print("No Status field"); sys.exit(1)
          opts = status["options"]
          print("Status options:", [o["name"] for o in opts])
          def pick(word):
              w = word.lower().replace("-", "").replace(" ", "")
              keys = {"todo": ["todo", "backlog"], "progress": ["progress", "doing"], "done": ["done", "complete", "closed"]}.get(w, [w])
              norm = lambda x: x.lower().replace("-", "").replace(" ", "")
              # An exact name first ("Done", not "Done But Not Deployed"), then a part of one.
              for k in keys:
                  for o in opts:
                      if norm(o["name"]) == k: return o
              for k in keys:
                  for o in opts:
                      if k in norm(o["name"]) and "not" not in norm(o["name"]): return o
              for k in keys:
                  for o in opts:
                      if k in norm(o["name"]): return o
              return None
          want = json.load(open(os.environ["RUNNER_TEMP"] + "/st/status.json"))
          done = missing = 0
          # Every item of the board, page by page (the board has more than 100 items; reading
          # only the first 100 left new cards as drafts, without a status, or added them twice).
          def all_items(fields):
              out, after = [], None
              while True:
                  r = gql("""query($login: String!, $number: Int!, $after: String) { user(login: $login) { projectV2(number: $number) {
                      items(first: 100, after: $after) { pageInfo { hasNextPage endCursor } nodes { %s } } } } }""" % fields,
                      {"login": owner, "number": number, "after": after})
                  if r.get("errors"): print("Read errors:", [e.get("type") for e in r["errors"]]); sys.exit(1)
                  page = r["data"]["user"]["projectV2"]["items"]
                  out += page["nodes"]
                  if not page["pageInfo"]["hasNextPage"]: return out
                  after = page["pageInfo"]["endCursor"]
          for n in all_items("id content { ... on DraftIssue { title } ... on Issue { title } ... on PullRequest { title } }"):
              t = (n.get("content") or {}).get("title")
              if t not in want: continue
              o = pick(want[t])
              if not o: missing += 1; continue
              u = gql("""mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                updateProjectV2ItemFieldValue(input: {projectId: $p, itemId: $i, fieldId: $f, value: {singleSelectOptionId: $o}}) { projectV2Item { id } } }""",
                {"p": proj["id"], "i": n["id"], "f": status["id"], "o": o["id"]})
              if u.get("errors"): print("Status errors:", [e.get("type") for e in u["errors"]]); sys.exit(1)
              done += 1
          print(f"Statuses set: {done}; no matching option: {missing}")
          PY
          python3 "$RUNNER_TEMP/status.py"

      - name: Read the board
        env:
          TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::The PROJECTS_TOKEN secret is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/board"
          cat > "$RUNNER_TEMP/read.py" <<'PY'
          import json, os, sys, urllib.request
          token = os.environ["TOKEN"]; owner = os.environ["BOARD_OWNER"]; number = int(os.environ["BOARD_NUMBER"])
          Q = """
          query($login: String!, $number: Int!, $after: String) {
            user(login: $login) { projectV2(number: $number) {
              title shortDescription url closed updatedAt
              items(first: 100, after: $after) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  type updatedAt
                  fieldValues(first: 30) { nodes {
                    ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2FieldCommon { name } } }
                    ... on ProjectV2ItemFieldTextValue { text field { ... on ProjectV2FieldCommon { name } } }
                    ... on ProjectV2ItemFieldNumberValue { number field { ... on ProjectV2FieldCommon { name } } }
                    ... on ProjectV2ItemFieldDateValue { date field { ... on ProjectV2FieldCommon { name } } }
                    ... on ProjectV2ItemFieldIterationValue { title field { ... on ProjectV2FieldCommon { name } } }
                    ... on ProjectV2ItemFieldUserValue { users(first: 5) { nodes { login } } field { ... on ProjectV2FieldCommon { name } } }
                    ... on ProjectV2ItemFieldLabelValue { labels(first: 10) { nodes { name } } field { ... on ProjectV2FieldCommon { name } } }
                  } }
                  content {
                    ... on DraftIssue { title body }
                    ... on Issue { title body number state url repository { nameWithOwner } }
                    ... on PullRequest { title body number state url repository { nameWithOwner } }
                  }
                }
              }
            } }
          }"""
          def call(after):
              req = urllib.request.Request("https://api.github.com/graphql",
                  data=json.dumps({"query": Q, "variables": {"login": owner, "number": number, "after": after}}).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          items, after, project = [], None, None
          while True:
              d = call(after)
              if d.get("errors"):
                  print("GraphQL errors:", len(d["errors"]), "(details not printed: public log)"); sys.exit(1)
              project = d["data"]["user"]["projectV2"]
              if project is None: print("Board not found or not readable with this token"); sys.exit(1)
              page = project["items"]
              items += page["nodes"]
              if not page["pageInfo"]["hasNextPage"]: break
              after = page["pageInfo"]["endCursor"]
          out = []
          for n in items:
              f = {}
              for v in n["fieldValues"]["nodes"]:
                  if not v or not v.get("field"): continue
                  name = v["field"]["name"]
                  if "users" in v: val = ", ".join(u["login"] for u in v["users"]["nodes"])
                  elif "labels" in v: val = ", ".join(l["name"] for l in v["labels"]["nodes"])
                  else: val = v.get("name") or v.get("text") or v.get("number") or v.get("date") or v.get("title")
                  f[name] = val
              c = n.get("content") or {}
              out.append({"type": n["type"], "updatedAt": n["updatedAt"], "fields": f,
                          "title": c.get("title"), "body": c.get("body"), "number": c.get("number"),
                          "state": c.get("state"), "url": c.get("url"),
                          "repo": (c.get("repository") or {}).get("nameWithOwner")})
          meta = {k: project[k] for k in ("title", "shortDescription", "url", "closed", "updatedAt")}
          d = os.environ["RUNNER_TEMP"] + "/board"
          json.dump({"project": meta, "items": out}, open(d + "/board.json", "w"), indent=1, ensure_ascii=False)
          # A readable copy, grouped by Status.
          by = {}
          for it in out: by.setdefault(it["fields"].get("Status") or "(no status)", []).append(it)
          with open(d + "/board.md", "w") as m:
              m.write(f"# {meta['title']}\n\n{meta.get('shortDescription') or ''}\n\nBoard updated {meta['updatedAt']}; {len(out)} items.\n")
              for st, its in by.items():
                  m.write(f"\n## {st} ({len(its)})\n\n")
                  for it in its:
                      extra = "; ".join(f"{k}: {v}" for k, v in it["fields"].items() if k not in ("Status", "Title") and v not in (None, ""))
                      ref = f" ({it['repo']}#{it['number']})" if it.get("number") else ""
                      m.write(f"- **{it['title'] or '(untitled)'}**{ref}" + (f" - {extra}" if extra else "") + "\n")
                      if it.get("body"):
                          body = it["body"].strip().replace("\r", "")
                          m.write("".join(f"  > {line}\n" for line in body.split("\n")[:15]))
          print(f"Board read: {len(out)} items")
          PY
          python3 "$RUNNER_TEMP/read.py"

      - name: Save into the private repository
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          rm -rf b && mkdir b && cd b
          if git clone -q --depth 1 --branch board "$URL" . 2>/dev/null; then :; else git init -q -b board && git remote add origin "$URL"; fi
          cp "$RUNNER_TEMP"/board/board.json "$RUNNER_TEMP"/board/board.md .
          git add board.json board.md
          if git diff --cached --quiet; then echo "No change on the board"; exit 0; fi
          git commit -q -m "Project board copy $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin board
          echo "Saved to branch board of the private repository"
