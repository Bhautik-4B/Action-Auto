name: Test phone APK

# Tests the phone app on the same emulator as "Android Phase 1": builds the APK
# from the PRIVATE repo Bhautik-4B/Game-Auto (folder android-app), installs it
# with the game, and lets it play as the workflow does: two devices at the same
# table, device 1 betting on dragon and device 2 on tiger in the same round.
# As in Phase 1, nothing private is printed here: the output goes to
# workflow_log.txt, saved with the run's results (branch "results" of the
# private repo, folder runs/<time>-phoneapp-run<id>-device<N>).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What the app does"
        type: choice
        options: [bet, table, login]
        default: bet
  push:
    paths:
      - .github/workflows/test-phone-apk.yml

permissions:
  contents: read

concurrency:
  group: test-phone-apk
  cancel-in-progress: false

env:
  PRIVATE_REPO: Bhautik-4B/Game-Auto

jobs:
  test:
    name: device ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        device: [1, 2]
    env:
      DEVICE: ${{ matrix.device }}
      APP_MODE: ${{ (inputs.mode == 'login' && '0') || (inputs.mode == 'table' && '1') || '2' }}
    steps:
      - name: Free disk space
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Enable KVM
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build phone APK
        working-directory: private/android-app
        run: |
          if ! gradle --no-daemon --console=plain assembleRelease >>"$RUNNER_TEMP/workflow_log.txt" 2>&1; then
            grep -E "^e: |error:|What went wrong" -A4 "$RUNNER_TEMP/workflow_log.txt" | head -60
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/phone-app.apk"
          echo "APP_APK=$RUNNER_TEMP/phone-app.apk" >> "$GITHUB_ENV"

      - name: Get game APK
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          mkdir -p "$RUNNER_TEMP/apk"
          gh release download --repo "$PRIVATE_REPO" --pattern '*.apk' --dir "$RUNNER_TEMP/apk" 2>/dev/null \
            || cp private/apk/*.apk "$RUNNER_TEMP/apk/" 2>/dev/null || { echo "::error::No APK found"; exit 1; }
          APK="$(ls "$RUNNER_TEMP"/apk/*.apk | grep -vE '/(com\.ludashi\.dualspace|net\.typeblog\.shelter)_' | head -1)"
          echo "GAME_APK=$APK" >> "$GITHUB_ENV"
          # Shelter, as in Phase 1: from release APK, else from F-Droid.
          ls "$RUNNER_TEMP"/apk/net.typeblog.shelter_*.apk >/dev/null 2>&1 \
            || gh release download APK --repo "$PRIVATE_REPO" --pattern 'net.typeblog.shelter_*.apk' --dir "$RUNNER_TEMP/apk" 2>/dev/null || true
          if ! ls "$RUNNER_TEMP"/apk/net.typeblog.shelter_*.apk >/dev/null 2>&1; then
            VC="$(curl -fsSL https://f-droid.org/api/v1/packages/net.typeblog.shelter | python3 -c 'import sys, json; print(json.load(sys.stdin)["suggestedVersionCode"])')"
            curl -fsSL -o "$RUNNER_TEMP/apk/net.typeblog.shelter_$VC.apk" "https://f-droid.org/repo/net.typeblog.shelter_$VC.apk" || true
          fi
          echo "SHELTER_APK=$(ls "$RUNNER_TEMP"/apk/net.typeblog.shelter_*.apk 2>/dev/null | head -1)" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Test the app on the emulator
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SYNC_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          WAIT_SEC: "1800"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 6144M
          disk-size: 8G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          # The app's step lines are shown here with guest IDs hidden (public log).
          script: |
            bash -o pipefail -c 'bash private/scripts/test_phone_app.sh "$GAME_APK" "$APP_APK" "$OUT_DIR" 2>&1 | tee -a "$RUNNER_TEMP/workflow_log.txt" | { grep --line-buffered -E "^\[[0-9:]{8}\] " | grep --line-buffered -vE "TAP |step_[0-9]+" | sed -u -E "s/(Guest ID: |guest|expected guest |but got |guest_id.: .)[0-9]+/\1***/g"; true; }'

      - name: Save results to private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          OUT_DIR="${OUT_DIR:-$RUNNER_TEMP/out}"; mkdir -p "$OUT_DIR"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RUN_DIR="runs/$(date -u +%Y%m%d-%H%M%S)-phoneapp-run${GITHUB_RUN_ID}-device${DEVICE}"
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          echo "Saving results to branch results, folder $RUN_DIR"
          for attempt in 1 2 3 4 5; do
            rm -rf results-repo
            if git clone -q --depth 1 --filter=blob:none --no-checkout --branch results "$URL" results-repo 2>/dev/null; then
              git -C results-repo sparse-checkout set --no-cone "/$RUN_DIR/" && git -C results-repo checkout -q results
            else
              mkdir results-repo && git -C results-repo init -q -b results && git -C results-repo remote add origin "$URL"
            fi
            mkdir -p "results-repo/$RUN_DIR" && cp -r "$OUT_DIR"/. "results-repo/$RUN_DIR"/
            cp "$RUNNER_TEMP/workflow_log.txt" "results-repo/$RUN_DIR/"
            git -C results-repo add -A && git -C results-repo commit -q -m "Phone app test results: $RUN_DIR"
            git -C results-repo push -q origin results && break
            echo "results branch changed under us (other device?), retry $attempt"; sleep $((attempt * 5))
          done

      - name: Status
        if: always()
        run: |
          S="$(sed -n 's/.*"status": "\([^"]*\)".*/\1/p' "$RUNNER_TEMP/out/result.json" 2>/dev/null)"; S="${S:-failed}"
          echo "Device $DEVICE: $S" | tee -a "$GITHUB_STEP_SUMMARY"
