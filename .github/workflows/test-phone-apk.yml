name: Test phone APK

# Tests the phone app on the same emulator as "Android Phase 1": builds the APK
# from the PRIVATE repo Bhautik-4B/Game-Auto (folder android-app), installs it
# with the game and a cloner app (from release APK), and lets it play as the
# workflow does: 2 clones one after another. Each emulator plays alone (their
# Wi-Fi pairing needs two phones on one network).
# As in Phase 1, nothing private is printed here: the output goes to
# workflow_log.txt, saved with the run's results (branch "results" of the
# private repo, folder runs/<time>-phoneapp-run<id>-device<N>).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What the app does"
        type: choice
        options: [bet, table, login]
        default: bet
      screens:
        description: "Phone shapes: same (1080x2280 on both), mixed (device 1: 20:9 1080x2400, device 2: 16:9 1080x1920) small (device 1: 720x1600, device 2: 1200x1920 tablet-like) or extreme (device 1: 21:9 1080x2520, device 2: 4:3 1536x2048)"
        type: choice
        options: [same, mixed, small, extreme]
        default: same
      backend:
        description: "Also test the backend: run it on this machine (private/backend), build the APK with BACKEND_URL=http://localhost:8080, sign the app in, then check the backend's database"
        type: boolean
        default: false
      shell_pack:
        description: "With backend: run the shell APK (no logic inside) with a logic pack signed by a test key, uploaded to the local backend and handed to everyone (the way the phones get it)"
        type: boolean
        default: false
      stop_bet:
        description: "Press Stop on device 1 right after its first bet, with the result not in yet: the app must read the result, then stop (STOP_BET: PASS)"
        type: boolean
        default: false
      cloner:
        description: "Cloner app for the test: dualspace (Dual Space Pro), clonehub (Clone Hub, com.multibox.clone.hub), multipleapp (Multiple App, com.multipleapp.clonespace; its APK here has no native code, so it may not run), clonemaster"
        type: choice
        options: [dualspace, clonehub, multipleapp, clonemaster]
        default: dualspace
      pcap:
        description: "Record the emulator's network (what the game downloads: hosts, plain HTTP or TLS, sizes) into the results"
        type: boolean
        default: false
      android:
        description: "Android version of the emulators (10 uses screen capture, 11+ the accessibility screenshot)"
        type: choice
        options: ["11", "10", "12", "12L", "13", "14", "15"]
        default: "11"
      image:
        description: "Emulator image: google_apis, or google_apis_playstore (newer Android: the Play image may carry the ARM translation the game needs)"
        type: choice
        options: [google_apis, google_apis_playstore]
        default: google_apis
      reinstall:
        description: "Reinstall test: after the first run the app's data is cleared (as an uninstall + install) and Start is pressed again; the clones stay in Dual Space Pro"
        type: boolean
        default: false
      probe:
        description: "Explore instead of the app test: cloner = the cloner's screens and direct opens; game = stop at the game's lobby, open Setting and the avatar (screenshots)"
        type: choice
        options: ["no", cloner, game]
        default: "no"
      stop_start:
        description: "Device 1 presses Stop on the app's box mid-run and Start again at once: the new run must show its box and play"
        type: boolean
        default: false
      perm_off:
        description: "Device 1 switches the screen permission off mid-run and on again (as Vivo does): the run must pause, then carry on"
        type: boolean
        default: false
      network:
        description: "Network of the emulators: slow ones make the game load slowly (the app then plays as on a real phone, without time limits)"
        type: choice
        options: [normal, slow, very_slow]
        default: normal
  push:
    paths:
      - .github/workflows/test-phone-apk.yml

permissions:
  contents: read

concurrency:
  # One queue per phone shape: a "mixed" run and a normal one run side by side.
  group: test-phone-apk-${{ inputs.screens || 'same' }}-${{ inputs.android || '11' }}-${{ inputs.shell_pack && 'pack' || 'nopack' }}-${{ inputs.pcap && 'pcap' || 'nopcap' }}-${{ inputs.network || 'normal' }}-${{ inputs.reinstall && 'reinstall' || 'keep' }}-${{ inputs.image || 'google_apis' }}-${{ inputs.probe || 'no' }}-${{ inputs.perm_off && 'permoff' || 'on' }}-${{ inputs.stop_start && 'ss' || 'x' }}-${{ inputs.stop_bet && 'sb' || 'x' }}-${{ inputs.cloner || 'dualspace' }}
  cancel-in-progress: false

env:
  PRIVATE_REPO: Bhautik-4B/Game-Auto

jobs:
  test:
    name: device ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [1, 2]
    env:
      DEVICE: ${{ matrix.device }}
      APP_MODE: ${{ (inputs.mode == 'login' && '0') || (inputs.mode == 'table' && '1') || '2' }}
    steps:
      - name: Free disk space
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Enable KVM
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # backend=true only: the backend runs here for the whole job (127.0.0.1:8080,
      # its database under the runner's temp folder); the phone reaches it
      # through adb reverse (test_phone_app.sh, BACKEND_TEST=1).
      - uses: actions/setup-node@v4
        if: inputs.backend
        with:
          node-version: "22"

      - name: Start backend
        if: inputs.backend
        working-directory: private/backend
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          npm ci --no-audit --no-fund
          B="$RUNNER_TEMP/backend"; mkdir -p "$B"
          JWT_SECRET="$(openssl rand -hex 32)" HOST=127.0.0.1 PORT=8080 DB_PATH="$B/app.db" NODE_ENV=production ALLOW_DIRECT_TOPUP=1 \
            LOGIC_UPLOAD_TOKEN="test-upload-token-0123456789" \
            setsid nohup node src/server.js > "$B/server.log" 2>&1 < /dev/null &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/healthz || { echo "::error::Backend did not start"; tail -50 "$B/server.log"; exit 1; }
          echo "BACKEND_URL=http://localhost:8080" >> "$GITHUB_ENV"
          echo "BACKEND_TEST=1" >> "$GITHUB_ENV"
          echo "BACKEND_DB=$B/app.db" >> "$GITHUB_ENV"

      - name: Build phone APK
        working-directory: private/android-app
        env:
          # x86_64 too, so the emulator runs ML Kit natively (see app/build.gradle.kts).
          APP_ABIS: x86_64,arm64-v8a
        run: |
          # The unit tests too (winner pairing, as the workflow's pick_pair).
          if ! gradle --no-daemon --console=plain assembleFullRelease testFullReleaseUnitTest >>"$RUNNER_TEMP/workflow_log.txt" 2>&1; then
            grep -E "^e: |error:|What went wrong|FAILED|Test.*>" -A4 "$RUNNER_TEMP/workflow_log.txt" | head -60
            exit 1
          fi
          cp app/build/outputs/apk/full/release/app-full-release.apk "$RUNNER_TEMP/phone-app.apk"
          echo "APP_APK=$RUNNER_TEMP/phone-app.apk" >> "$GITHUB_ENV"

      # shell_pack: the logic pack from the full compile above, signed with a key
      # made here; the shell APK is built with that key's public half, the pack
      # is uploaded to the local backend and handed to everyone. The run then
      # uses the shell APK, which must download and load the pack (its log:
      # "Bot logic: v1").
      - name: Shell APK + logic pack
        if: inputs.backend && inputs.shell_pack
        working-directory: private/android-app
        env:
          APP_ABIS: x86_64,arm64-v8a
        run: |
          set -e
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/test-logic-key.pem" 2>/dev/null
          export LOGIC_PUBLIC_KEY="$(openssl pkey -in "$RUNNER_TEMP/test-logic-key.pem" -pubout -outform DER 2>/dev/null | base64 -w0)"
          if ! gradle --no-daemon --console=plain assembleShellRelease >>"$RUNNER_TEMP/workflow_log.txt" 2>&1; then
            grep -E "^e: |error:|What went wrong|FAILED" -A4 "$RUNNER_TEMP/workflow_log.txt" | head -60
            exit 1
          fi
          ../scripts/make_logic_pack.sh . "$RUNNER_TEMP/pack" 1 "$RUNNER_TEMP/test-logic-key.pem" | tee -a "$GITHUB_STEP_SUMMARY"
          CODE=$(curl -sS -o "$RUNNER_TEMP/pack/answer.json" -w '%{http_code}' -X PUT http://127.0.0.1:8080/api/v1/app/logic/packs/1 \
            -H "Authorization: Bearer test-upload-token-0123456789" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/pack/upload.json")
          [ "$CODE" = 200 ] || { echo "pack upload answered $CODE: $(cat "$RUNNER_TEMP/pack/answer.json")"; exit 1; }
          (cd ../backend && DB_PATH="$BACKEND_DB" JWT_SECRET=x NODE_ENV=test node scripts/logic.js all 1) | tee -a "$GITHUB_STEP_SUMMARY"
          cp app/build/outputs/apk/shell/release/app-shell-release.apk "$RUNNER_TEMP/phone-app.apk"
          echo "The run uses the SHELL APK with logic pack v1 from the local backend" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Get game APK
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          mkdir -p "$RUNNER_TEMP/apk"
          gh release download --repo "$PRIVATE_REPO" --pattern '*.apk' --dir "$RUNNER_TEMP/apk" 2>/dev/null \
            || cp private/apk/*.apk "$RUNNER_TEMP/apk/" 2>/dev/null || { echo "::error::No APK found"; exit 1; }
          # The game is base.apk; every cloner APK of the release is left out.
          APK="$RUNNER_TEMP/apk/base.apk"
          [ -f "$APK" ] || APK="$(ls "$RUNNER_TEMP"/apk/*.apk | grep -vE '/(com\.ludashi\.dualspace|net\.typeblog\.shelter|co\.keeptop\.multi\.space|com\.dualspacepro\.multispace|com\.dualspace\.multispace|com\.cmaster|com\.multibox|com\.multipleapp|CLONE-HUB|MULTIPLE-APP)' | head -1)"
          echo "GAME_APK=$APK" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          # The cloner app from release APK, as in Phase 1 (Multi Space, else Dual
          # Space Pro, else Dual Space); the app plays 2 clones of the game in it.
          gh release download APK --repo "$PRIVATE_REPO" --pattern '*.apk' --dir "$RUNNER_TEMP/apk" --skip-existing 2>/dev/null || true
          # Dual Space Pro, from this repo's release "Dual" (uploaded by the owner).
          curl -fsSL -o "$RUNNER_TEMP/apk/com.dualspacepro.multispace_dual.apk" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/Dual/base.apk" || rm -f "$RUNNER_TEMP/apk/com.dualspacepro.multispace_dual.apk"
          # The two of Clone Master's kind (release "APK" of the private repo, uploaded by the owner).
          [ -f "$RUNNER_TEMP/apk/CLONE-HUB.apk" ] && mv "$RUNNER_TEMP/apk/CLONE-HUB.apk" "$RUNNER_TEMP/apk/com.multibox.clone.hub_1.apk"
          [ -f "$RUNNER_TEMP/apk/MULTIPLE-APP.apk" ] && mv "$RUNNER_TEMP/apk/MULTIPLE-APP.apk" "$RUNNER_TEMP/apk/com.multipleapp.clonespace_1.apk"
          case "${{ inputs.cloner || 'dualspace' }}" in
            clonehub) ORDER="com.multibox.clone.hub" ;;
            multipleapp) ORDER="com.multipleapp.clonespace" ;;
            clonemaster) ORDER="com.cmaster.cloner" ;;
            *) ORDER="co.keeptop.multi.space com.dualspacepro.multispace com.ludashi.dualspace" ;;
          esac
          for C in $ORDER; do
            F="$(ls "$RUNNER_TEMP"/apk/${C}_*.apk 2>/dev/null | head -1)"
            [ -n "$F" ] && { echo "CLONER_APK=$F" >> "$GITHUB_ENV"; echo "CLONER_PKG=$C" >> "$GITHUB_ENV"; echo "Cloner: $(basename "$F")"; break; }
          done

      - name: Test the app on the emulator
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Each emulator plays alone: two GitHub machines share no Wi-Fi, so the
          # phones' Wi-Fi pairing is tested on real phones only.
          APP_DEVICE: "0"
          # Device 2 blocks ads (the app's "Block ads": Private DNS); device 1
          # does not, so the app's own ad closing is tested there.
          BLOCK_ADS: ${{ matrix.device == 2 && '1' || '0' }}
          # Start the app twice: a clone deleted after a loss comes back as a new guest.
          RERUN: "1"
          REINSTALL: ${{ inputs.reinstall && '1' || '0' }}
          SCREEN_SIZE: ${{ (inputs.screens == 'mixed' && (matrix.device == 1 && '1080x2400' || '1080x1920')) || (inputs.screens == 'small' && (matrix.device == 1 && '720x1600' || '1200x1920')) || (inputs.screens == 'extreme' && (matrix.device == 1 && '1080x2520' || '1536x2048')) || '' }}
          WAIT_SEC: ${{ (inputs.network == 'slow' || inputs.network == 'very_slow') && '2700' || '2100' }}
          NETWORK_SPEED: ${{ (inputs.network == 'slow' && 'umts') || (inputs.network == 'very_slow' && 'edge') || '' }}
          AS_PHONE: ${{ (inputs.network == 'slow' || inputs.network == 'very_slow') && '1' || '0' }}
          CLONES: "2"
          PROBE_CLONER: ${{ inputs.probe == 'cloner' && '1' || '0' }}
          PROBE_GAME: ${{ inputs.probe == 'game' && '1' || '0' }}
          PERM_OFF: ${{ (inputs.perm_off && matrix.device == 1) && '1' || '0' }}
          STOP_START: ${{ (inputs.stop_start && matrix.device == 1) && '1' || '0' }}
          STOP_BET: ${{ (inputs.stop_bet && matrix.device == 1) && '1' || '0' }}
        with:
          api-level: ${{ (inputs.android == '10' && 29) || (inputs.android == '12' && 31) || (inputs.android == '12L' && 32) || (inputs.android == '13' && 33) || (inputs.android == '14' && 34) || (inputs.android == '15' && 35) || 30 }}
          target: ${{ inputs.image || 'google_apis' }}
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 6144M
          disk-size: 8G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save ${{ inputs.pcap && format('-tcpdump {0}/net.pcap', runner.temp) || '' }}
          disable-animations: true
          # The app's step lines are shown here with guest IDs hidden (public log).
          script: |
            bash -o pipefail -c 'bash private/scripts/test_phone_app.sh "$GAME_APK" "$APP_APK" "$OUT_DIR" 2>&1 | tee -a "$RUNNER_TEMP/workflow_log.txt" | { grep --line-buffered -E "^\[[0-9:]{8} [AP]M\] " | grep --line-buffered -vE "TAP |step_[0-9]+" | sed -u -E "s/(Guest ID: |guest|expected guest |but got |guest_id.: .)[0-9]+/\1***/g"; true; }'

      # pcap: what went over the network, by host: plain HTTP (its requests, cacheable
      # on the phone) or TLS (its server name), and how many bytes. Into the results.
      - name: Network capture summary
        if: always() && inputs.pcap
        run: |
          sudo apt-get install -y -qq tshark >/dev/null 2>&1 || true
          P="$RUNNER_TEMP/net.pcap"; D="${OUT_DIR:-$RUNNER_TEMP/out}"; mkdir -p "$D"
          [ -s "$P" ] || { echo "no capture" | tee "$D/network.txt"; exit 0; }
          {
            echo "### Bytes by server (TLS server name or HTTP host)"
            tshark -r "$P" -Y "tls.handshake.extensions_server_name" -T fields -e tls.handshake.extensions_server_name -e ip.dst 2>/dev/null | sort -u | head -60
            echo; echo "### Plain HTTP requests (host, URL, answer size)"
            tshark -r "$P" -Y "http.request" -T fields -e http.host -e http.request.uri 2>/dev/null | sort | uniq -c | sort -rn | head -80
            echo; echo "### HTTP answers (content length by host)"
            tshark -r "$P" -Y "http.response" -T fields -e http.response_for.uri -e http.content_length 2>/dev/null | sort | uniq -c | sort -rn | head -40
            echo; echo "### Traffic by destination (bytes)"
            tshark -r "$P" -q -z conv,ip 2>/dev/null | tail -n +6 | head -40
          } > "$D/network.txt" 2>&1
          { echo "Network capture (device $DEVICE):"; echo '```'; head -120 "$D/network.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Backend server log
        if: always() && inputs.backend
        run: |
          mkdir -p "${OUT_DIR:-$RUNNER_TEMP/out}/backend"
          cp "$RUNNER_TEMP/backend/server.log" "${OUT_DIR:-$RUNNER_TEMP/out}/backend/server.log" 2>/dev/null || true

      - name: Save results to private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          OUT_DIR="${OUT_DIR:-$RUNNER_TEMP/out}"; mkdir -p "$OUT_DIR"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RUN_DIR="runs/$(TZ=Asia/Kolkata date +%Y%m%d-%H%M%S)-phoneapp-run${GITHUB_RUN_ID}-device${DEVICE}"
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          echo "Saving results to branch results, folder $RUN_DIR"
          for attempt in 1 2 3 4 5; do
            rm -rf results-repo
            if git clone -q --depth 1 --filter=blob:none --no-checkout --branch results "$URL" results-repo 2>/dev/null; then
              git -C results-repo sparse-checkout set --no-cone "/$RUN_DIR/" && git -C results-repo checkout -q results
            else
              mkdir results-repo && git -C results-repo init -q -b results && git -C results-repo remote add origin "$URL"
            fi
            mkdir -p "results-repo/$RUN_DIR" && cp -r "$OUT_DIR"/. "results-repo/$RUN_DIR"/
            cp "$RUNNER_TEMP/workflow_log.txt" "results-repo/$RUN_DIR/"
            git -C results-repo add -A && git -C results-repo commit -q -m "Phone app test results: $RUN_DIR"
            git -C results-repo push -q origin results && break
            echo "results branch changed under us (other device?), retry $attempt"; sleep $((attempt * 5))
          done

      - name: Status
        if: always()
        run: |
          S="$(sed -n 's/.*"status": "\([^"]*\)".*/\1/p' "$RUNNER_TEMP/out/result.json" 2>/dev/null)"; S="${S:-failed}"
          echo "Device $DEVICE: $S" | tee -a "$GITHUB_STEP_SUMMARY"

      # backend=true only: the job fails when check_backend.mjs's asserts fail.
      - name: Backend check
        if: always() && inputs.backend
        run: |
          D="$RUNNER_TEMP/out/backend"
          E="$(cat "$D/check_exit" 2>/dev/null)"
          { echo "Device $DEVICE backend check:"; echo '```'; grep -E "^(PASS|FAIL|BACKEND CHECK|runs:|rounds:|wallet|devices:|users:|sync_ops:|settings rows:|clone_states:|winners:)" "$D/check_stdout.txt" 2>/dev/null || echo "no check output"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$E" = 0 ] || { echo "::error::Backend check failed (exit ${E:-none})"; exit 1; }
