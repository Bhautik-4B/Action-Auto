name: Android Phase 1 - Guest to Lobby

# Runs on this PUBLIC repo (free Actions minutes). All code, the APK and the
# screenshots live in the PRIVATE repo Bhautik-4B/Game-Auto, reached with the
# PRIVATE_REPO_TOKEN secret. Nothing private is uploaded here: logs of public
# repos are public, so keep secrets out of echo statements.
#
# One run starts up to two DEVICES at the same time (job "device 1" and
# "device 2", each on its own machine). A device is an emulator restored from
# its own cached snapshot, so it keeps the same identity and the same guest
# account from run to run; its saved login lives on branch "state-<device>".

on:
  workflow_dispatch:
    inputs:
      devices:
        description: How many devices (parallel jobs) to run, 1 or 2
        type: choice
        options: ["1", "2"]
        default: "2"
      bet_side:
        description: Side both devices bet on
        type: choice
        options: [dragon, tiger]
        default: dragon
      api_level:
        description: Android API level of the emulator (30+ can run ARM-only games)
        default: "30"
      private_ref:
        description: Branch of Game-Auto to take scripts/APK from
        default: main
      script:
        description: Script in Game-Auto/scripts to run
        default: run_dragon_tiger_chip5_continue.sh
      apk_release_tag:
        description: Release tag in Game-Auto to download the APK from (empty = latest release, falls back to apk/ folder)
        default: ""
      new_guest:
        description: Ignore the saved login (false = continue the account saved by the last run)
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # only for deleting old runs of this workflow (last step)

concurrency:
  group: android-phase1
  cancel-in-progress: false

env:
  PRIVATE_REPO: Bhautik-4B/Game-Auto

jobs:
  phase1:
    name: device ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false       # one device failing must not cancel the other
      matrix:
        # [1] or [1, 2], from the "devices" input
        device: ${{ fromJSON(inputs.devices == '1' && '[1]' || '[1, 2]') }}
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      # The emulator snapshot cache unpacks to its full disk + memory size, and the
      # Android system image needs room too; the runner's preinstalled .NET, GHC,
      # CodeQL and Boost are not used here, so free that space first.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost &
          wait
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.private_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Get APK
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TAG: ${{ inputs.apk_release_tag }}
          SCRIPT_IN: ${{ inputs.script }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          if gh release download $TAG --repo "$PRIVATE_REPO" --pattern '*.apk' --dir "$RUNNER_TEMP/apk" 2>/dev/null; then
            echo "APK taken from release ${TAG:-latest}"
          else
            cp private/apk/*.apk "$RUNNER_TEMP/apk/" 2>/dev/null || { echo "::error::No APK found (release or apk/ folder in $PRIVATE_REPO)"; exit 1; }
            echo "APK taken from apk/ folder"
          fi
          APK="$(ls "$RUNNER_TEMP"/apk/*.apk | head -1)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "RUN_SCRIPT=$(basename "$SCRIPT_IN")" >> "$GITHUB_ENV"
          ls -lh "$RUNNER_TEMP/apk"

      - name: Get saved login (branch "state-<device>")
        if: ${{ !inputs.new_guest }}
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          if git clone -q --depth 1 --branch "state-$DEVICE" "$URL" state-repo 2>/dev/null && [ -f state-repo/guest_state.tgz ]; then
            cp state-repo/guest_state.tgz "$RUNNER_TEMP/guest_state_in.tgz"
            echo "GUEST_STATE_IN=$RUNNER_TEMP/guest_state_in.tgz" >> "$GITHUB_ENV"
            echo "Device $DEVICE: continuing the saved account"
          else
            echo "Device $DEVICE: no saved login; the game signs this device in"
          fi
          rm -rf state-repo

      - name: Install OCR tools
        # "apt-get update" alone can take several minutes; run it only if the
        # install fails on the runner image's package lists.
        run: |
          PKGS="tesseract-ocr imagemagick"
          sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null; }

      # A booted emulator snapshot is cached between runs, so the emulator starts
      # in seconds instead of a full cold boot. Each device has its own snapshot
      # (and so its own identity); the first run of a device creates it once.
      - name: Emulator snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api_level }}-pixel4-r3g-d4g-device${{ matrix.device }}-v1

      - name: Create emulator snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot created for the cache"

      - name: Run Phase 1 on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BET_SIDE: ${{ inputs.bet_side }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash "private/scripts/$RUN_SCRIPT" "$APK_PATH" "$OUT_DIR"

      # What happens to this device's account after the run, from result.json:
      #   target_reached (balance >= target): archived for good on branch "accounts"
      #     (only ever added to, never deleted)
      #   balance_zero: the saved login is removed (branch "state-<device>" deleted)
      #   anything else: guest_state.tgz is kept on branch "state-<device>"
      # Two devices may finish at the same moment, so pushes to the shared
      # "accounts" branch are retried after pulling.
      - name: Archive, drop or keep the account
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          field() { sed -n "s/.*\"$1\": \"\{0,1\}\([^\",}]*\).*/\1/p" "$2" 2>/dev/null || true; }
          STATUS="$(field status "$OUT_DIR/result.json")"
          echo "Device $DEVICE run status: ${STATUS:-none}"
          drop_state() {  # delete this device's state branch (needs a local repo to push from)
            rm -rf drop && git init -q drop && { git -C drop push -q "$URL" --delete "state-$DEVICE" 2>/dev/null || true; }; rm -rf drop
          }
          ACC="$OUT_DIR/accounts"; mkdir -p "$ACC"
          if [ "$STATUS" = target_reached ] && [ -f "$OUT_DIR/guest_state.tgz" ]; then
            NAME="$(date -u +%Y%m%d-%H%M%S)-device${DEVICE}-guest$(field guest_id "$OUT_DIR/result.json")-INR$(field end_balance "$OUT_DIR/result.json")"
            mv "$OUT_DIR/guest_state.tgz" "$ACC/$NAME.tgz" && cp "$OUT_DIR/result.json" "$ACC/$NAME.json"
          fi

          if ls "$ACC"/*.tgz >/dev/null 2>&1; then
            for attempt in 1 2 3 4 5; do
              rm -rf acc
              if git clone -q --depth 1 --branch accounts "$URL" acc 2>/dev/null; then :
              else mkdir acc && git -C acc init -q -b accounts && git -C acc remote add origin "$URL"
                printf 'date,device,guest_id,balance,file,run\n' > acc/index.csv; fi
              mkdir -p acc/accounts
              for f in "$ACC"/*.tgz; do
                NAME="$(basename "$f" .tgz)"; J="$ACC/$NAME.json"
                cp "$f" "acc/accounts/$NAME.tgz"; [ -f "$J" ] && cp "$J" "acc/accounts/$NAME.json"
                echo "$(date -u +%Y-%m-%d),$DEVICE,$(field guest_id "$J"),$(field end_balance "$J"),accounts/$NAME.tgz,${GITHUB_RUN_ID}" >> acc/index.csv
              done
              git -C acc add -A && git -C acc commit -q -m "Archive account from run ${GITHUB_RUN_ID}, device $DEVICE"
              # Plain push, never forced: archived accounts are never overwritten.
              if git -C acc push -q origin accounts; then
                for f in "$ACC"/*.tgz; do echo "Archived account accounts/$(basename "$f")" | tee -a "$GITHUB_STEP_SUMMARY"; done
                rm -f "$ACC"/*.tgz; break
              fi
              echo "accounts branch changed under us (other device?), retry $attempt"; sleep $((attempt * 5))
            done
            ls "$ACC"/*.tgz >/dev/null 2>&1 && echo "::error::Could not push to branch accounts after 5 attempts; account kept in results"
          fi

          case "$STATUS" in
            target_reached)
              drop_state
              echo "Device $DEVICE: account archived; saved login cleared" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            balance_zero)
              drop_state
              echo "Device $DEVICE: balance 0; saved login removed" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *)
              if [ -f "$OUT_DIR/guest_state.tgz" ]; then
                rm -rf state-out && mkdir state-out && cp "$OUT_DIR/guest_state.tgz" state-out/
                # One commit only: the branch keeps just the current login.
                git -C state-out init -q -b "state-$DEVICE" && git -C state-out add guest_state.tgz \
                  && git -C state-out commit -q -m "Device $DEVICE login from run ${GITHUB_RUN_ID}"
                git -C state-out push -q -f "$URL" "state-$DEVICE"
                echo "Device $DEVICE: account kept (${STATUS:-no status}); next run continues it" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "Device $DEVICE: no login to save"
              fi ;;
          esac
          rm -f "$OUT_DIR/guest_state.tgz"

      # Both devices push their folder to the same branch, so the push is retried
      # after pulling if the other device got there first.
      - name: Save results to private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          [ -d "$OUT_DIR" ] || { echo "No output to save"; exit 0; }
          RUN_DIR="runs/$(date -u +%Y%m%d-%H%M%S)-${RUN_SCRIPT%.sh}-run${GITHUB_RUN_ID}-device${DEVICE}"
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          find "$OUT_DIR" -name "*.ocr-*.json" -delete
          for attempt in 1 2 3 4 5; do
            rm -rf results-repo
            if ! git clone -q --depth 1 --branch results "$URL" results-repo 2>/dev/null; then
              mkdir results-repo && git -C results-repo init -q -b results && git -C results-repo remote add origin "$URL"
            fi
            mkdir -p "results-repo/$RUN_DIR" && cp -r "$OUT_DIR"/. "results-repo/$RUN_DIR"/
            git -C results-repo add -A && git -C results-repo commit -q -m "Phase 1 results: $RUN_DIR"
            git -C results-repo push -q origin results && break
            echo "results branch changed under us (other device?), retry $attempt"; sleep $((attempt * 5))
          done
          {
            echo "### Device $DEVICE finished"
            echo "Results saved to the private repo, branch \`results\`, folder \`$RUN_DIR\`."
            echo
            echo "Status: \`$(sed -n 's/.*"status": "\([^"]*\)".*/\1/p' "$OUT_DIR/result.json" 2>/dev/null)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep only the newest 3 runs of this workflow in the Actions tab (this run
      # counts as one); older finished runs and their public logs are deleted.
      # Done by device 1 only.
      - name: Delete old runs (keep newest 3)
        if: always() && matrix.device == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-phase1.yml/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[3:][] | select(.status == "completed") | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" && echo "Deleted run $id"
            done
