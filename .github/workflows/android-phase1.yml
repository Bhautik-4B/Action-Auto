name: Android Phase 1 - Guest to Lobby

# Runs on this PUBLIC repo (free Actions minutes). All code, the APK and the
# screenshots live in the PRIVATE repo Bhautik-4B/Game-Auto, reached with the
# PRIVATE_REPO_TOKEN secret. Nothing private is uploaded here: logs of public
# repos are public, so every step below writes its output to workflow_log.txt,
# which is saved with the run's results in the private repo. The public log of
# each device shows just one line: "Device <N>: <status>".
#
# One click on "Run workflow" (no questions) starts two DEVICES at the same time
# (job "device 1" and "device 2", each on its own machine). Every run is a fresh
# start: a new emulator and a new guest, nothing saved afterwards. Both devices
# open Dragon Tiger, sit at the same table and bet on the same round: device 1
# on dragon, device 2 on tiger (scripts/run_explore_dragon_tiger.sh).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # only for deleting old runs of this workflow (last step)

concurrency:
  group: android-phase1
  cancel-in-progress: false

env:
  PRIVATE_REPO: Bhautik-4B/Game-Auto

jobs:
  phase1:
    name: device ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false       # one device failing must not cancel the other
      matrix:
        device: [1, 2]
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      # The Android system image needs room; the runner's preinstalled .NET, GHC,
      # CodeQL and Boost are not used here, so free that space first.
      - name: Free disk space
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost &
          wait
          df -h / | tail -1

      - name: Enable KVM
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Get APK
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          mkdir -p "$RUNNER_TEMP/apk"
          if gh release download --repo "$PRIVATE_REPO" --pattern '*.apk' --dir "$RUNNER_TEMP/apk" 2>/dev/null; then
            echo "APK taken from the latest release"
          else
            cp private/apk/*.apk "$RUNNER_TEMP/apk/" 2>/dev/null || { echo "::error::No APK found (release or apk/ folder in $PRIVATE_REPO)"; exit 1; }
            echo "APK taken from apk/ folder"
          fi
          APK="$(ls "$RUNNER_TEMP"/apk/*.apk | head -1)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "RUN_SCRIPT=run_explore_dragon_tiger.sh" >> "$GITHUB_ENV"

      - name: Install OCR tools
        # "apt-get update" alone can take several minutes; run it only if the
        # install fails on the runner image's package lists.
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          PKGS="tesseract-ocr imagemagick"
          sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null; }

      - name: Run Phase 1 on emulator
        # A normal run takes 6-15 minutes; stop a stuck one (frozen emulator)
        # instead of letting it use the whole job. Results are still saved.
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FRESH_START: "1"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          # Full output goes to workflow_log.txt (private results); the script's own
          # step lines ("[12:34:56] ...") are also shown here, with guest IDs hidden
          # because this log is public.
          script: |
            bash -o pipefail -c 'bash "private/scripts/$RUN_SCRIPT" "$APK_PATH" "$OUT_DIR" 2>&1 | tee -a "$RUNNER_TEMP/workflow_log.txt" | { grep --line-buffered -E "^\[[0-9:]{8}\] " | grep --line-buffered -vE " step_[0-9]+ " | sed -u -E "s/(Guest ID: |guest|expected guest |but got )[0-9]+/\1***/g"; true; }'

      # If this device failed before its script could say so (e.g. the emulator
      # never started), tell the other device now, so it does not wait 15 minutes
      # at the table for a partner that never comes (see sync_wait in the script).
      - name: Tell the other device this one failed
        if: failure()
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          git -C private push -q origin "HEAD:refs/heads/sync/${GITHUB_RUN_ID}/d${DEVICE}-failed" \
            && echo "Sent sync/${GITHUB_RUN_ID}/d${DEVICE}-failed" || echo "Could not send the failed signal"

      # Both devices push their folder to the same branch, so the push is retried
      # after pulling if the other device got there first.
      - name: Save results to private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          OUT_DIR="${OUT_DIR:-$RUNNER_TEMP/out}"; mkdir -p "$OUT_DIR"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RUN_DIR="runs/$(date -u +%Y%m%d-%H%M%S)-${RUN_SCRIPT%.sh}-run${GITHUB_RUN_ID}-device${DEVICE}"
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          find "$OUT_DIR" -name "*.ocr-*.json" -delete
          rm -f "$OUT_DIR/guest_state.tgz"  # logins are never stored in results
          echo "Saving results to branch results, folder $RUN_DIR"
          # The results branch holds every old run (gigabytes), so clone it without
          # file contents and check out only this run's (new, empty) folder.
          for attempt in 1 2 3 4 5; do
            rm -rf results-repo
            if git clone -q --depth 1 --filter=blob:none --no-checkout --branch results "$URL" results-repo 2>/dev/null; then
              git -C results-repo sparse-checkout set --no-cone "/$RUN_DIR/" && git -C results-repo checkout -q results
            else
              mkdir results-repo && git -C results-repo init -q -b results && git -C results-repo remote add origin "$URL"
            fi
            mkdir -p "results-repo/$RUN_DIR" && cp -r "$OUT_DIR"/. "results-repo/$RUN_DIR"/
            cp "$RUNNER_TEMP/workflow_log.txt" "results-repo/$RUN_DIR/"
            git -C results-repo add -A && git -C results-repo commit -q -m "Phase 1 results: $RUN_DIR"
            git -C results-repo push -q origin results && break
            echo "results branch changed under us (other device?), retry $attempt"; sleep $((attempt * 5))
          done

      # The only line this device prints to the public log and summary.
      - name: Status
        if: always()
        run: |
          S="$(sed -n 's/.*"status": "\([^"]*\)".*/\1/p' "$RUNNER_TEMP/out/result.json" 2>/dev/null)"; S="${S:-failed}"
          echo "Device $DEVICE: $S" | tee -a "$GITHUB_STEP_SUMMARY"

  # Keep only the newest 3 runs of this workflow in the Actions tab (this run
  # counts as one); older finished runs and their public logs are deleted.
  # Runs once, after both devices are done, whatever their result.
  cleanup:
    name: delete old runs
    needs: phase1
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs (keep newest 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-phase1.yml/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[3:][] | select(.status == "completed") | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" && echo "Deleted run $id"
            done
