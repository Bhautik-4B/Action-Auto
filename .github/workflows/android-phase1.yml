name: Android Phase 1 - Guest to Lobby

# Runs on this PUBLIC repo (free Actions minutes). All code, the APK and the
# screenshots live in the PRIVATE repo Bhautik-4B/Game-Auto, reached with the
# PRIVATE_REPO_TOKEN secret. Nothing private is uploaded here: logs of public
# repos are public, so every step below writes its output to workflow_log.txt,
# which is saved with the run's results in the private repo. The public log of
# each device shows just one line: "Device <N>: <status>".
#
# One run starts up to two DEVICES at the same time (job "device 1" and
# "device 2", each on its own machine). A device is an emulator restored from
# its own cached snapshot, so it keeps the same identity and the same guest
# account from run to run; its saved login lives on branch "state-<device>".
# A device whose guest drops under INR 5 is retired (branch "retired") and
# never opened again.
#
# fresh_start (the default) skips all of that: a new emulator every run (no
# cache), no saved login, nothing kept afterwards, so the game makes a new
# guest each time. Fresh-start runs never bet (FRESH_START=1 in the scripts).

on:
  workflow_dispatch:
    inputs:
      devices:
        description: How many devices (parallel jobs) to run, 1 or 2
        type: choice
        options: ["1", "2"]
        default: "2"
      bet_side:
        description: Side both devices bet on
        type: choice
        options: [dragon, tiger]
        default: dragon
      api_level:
        description: Android API level of the emulator (30+ can run ARM-only games)
        default: "30"
      private_ref:
        description: Branch of Game-Auto to take scripts/APK from
        default: main
      script:
        description: Script in Game-Auto/scripts to run
        default: run_explore_dragon_tiger.sh
      apk_release_tag:
        description: Release tag in Game-Auto to download the APK from (empty = latest release, falls back to apk/ folder)
        default: ""
      new_guest:
        description: Ignore the saved login (false = continue the account saved by the last run)
        type: boolean
        default: false
      fresh_start:
        description: New emulator and new guest every run, nothing saved; never bets (uncheck to bet with the saved account)
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # only for deleting old runs of this workflow (last step)

concurrency:
  group: android-phase1
  cancel-in-progress: false

env:
  PRIVATE_REPO: Bhautik-4B/Game-Auto

jobs:
  phase1:
    name: device ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false       # one device failing must not cancel the other
      matrix:
        # [1] or [1, 2], from the "devices" input
        device: ${{ fromJSON(inputs.devices == '1' && '[1]' || '[1, 2]') }}
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      # A retired device (guest balance fell under 5) is skipped for good.
      # Delete its file on branch "retired" to use it again.
      - name: Check device
        if: ${{ !inputs.fresh_start }}
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          if git clone -q --depth 1 --branch retired "$URL" retired-repo 2>/dev/null && [ -f "retired-repo/device$DEVICE.json" ]; then
            echo "RETIRED=1" >> "$GITHUB_ENV"
            echo "Device $DEVICE is retired: $(cat "retired-repo/device$DEVICE.json")"
          fi
          rm -rf retired-repo

      # The emulator snapshot cache unpacks to its full disk + memory size, and the
      # Android system image needs room too; the runner's preinstalled .NET, GHC,
      # CodeQL and Boost are not used here, so free that space first.
      - name: Free disk space
        if: env.RETIRED != '1'
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost &
          wait
          df -h / | tail -1

      - name: Enable KVM
        if: env.RETIRED != '1'
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout private repo
        if: env.RETIRED != '1'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.private_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Get APK
        if: env.RETIRED != '1'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TAG: ${{ inputs.apk_release_tag }}
          SCRIPT_IN: ${{ inputs.script }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          mkdir -p "$RUNNER_TEMP/apk"
          if gh release download $TAG --repo "$PRIVATE_REPO" --pattern '*.apk' --dir "$RUNNER_TEMP/apk" 2>/dev/null; then
            echo "APK taken from release ${TAG:-latest}"
          else
            cp private/apk/*.apk "$RUNNER_TEMP/apk/" 2>/dev/null || { echo "::error::No APK found (release or apk/ folder in $PRIVATE_REPO)"; exit 1; }
            echo "APK taken from apk/ folder"
          fi
          APK="$(ls "$RUNNER_TEMP"/apk/*.apk | head -1)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "RUN_SCRIPT=$(basename "$SCRIPT_IN")" >> "$GITHUB_ENV"

      - name: Get saved login (branch "state-<device>")
        if: env.RETIRED != '1' && !inputs.new_guest && !inputs.fresh_start
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          if git clone -q --depth 1 --branch "state-$DEVICE" "$URL" state-repo 2>/dev/null && [ -f state-repo/guest_state.tgz ]; then
            cp state-repo/guest_state.tgz "$RUNNER_TEMP/guest_state_in.tgz"
            echo "GUEST_STATE_IN=$RUNNER_TEMP/guest_state_in.tgz" >> "$GITHUB_ENV"
            echo "Device $DEVICE: continuing the saved account"
          else
            echo "Device $DEVICE: no saved login; the game signs this device in"
          fi
          rm -rf state-repo

      - name: Install OCR tools
        if: env.RETIRED != '1'
        # "apt-get update" alone can take several minutes; run it only if the
        # install fails on the runner image's package lists.
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          PKGS="tesseract-ocr imagemagick"
          sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null; }

      # A booted emulator snapshot is cached between runs, so the emulator starts
      # in seconds instead of a full cold boot. Each device has its own snapshot
      # (and so its own identity); the first run of a device creates it once.
      - name: Emulator snapshot cache
        if: env.RETIRED != '1' && !inputs.fresh_start
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api_level }}-pixel4-r3g-d4g-device${{ matrix.device }}-v1

      - name: Create emulator snapshot (first run only)
        if: env.RETIRED != '1' && !inputs.fresh_start && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot created for the cache" >>"$RUNNER_TEMP/workflow_log.txt"

      - name: Run Phase 1 on emulator
        if: env.RETIRED != '1'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BET_SIDE: ${{ inputs.bet_side }}
          FRESH_START: ${{ inputs.fresh_start && '1' || '0' }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash "private/scripts/$RUN_SCRIPT" "$APK_PATH" "$OUT_DIR" >>"$RUNNER_TEMP/workflow_log.txt" 2>&1

      # What happens to this device's account after the run, from result.json:
      #   target_reached (balance >= target): archived for good on branch "accounts"
      #     (only ever added to, never deleted)
      #   balance under 5 (status balance_zero, or end_balance < 5): the saved
      #     login is deleted (branch "state-<device>") and the device is retired
      #     (branch "retired"), so this guest is never opened again
      #   anything else: guest_state.tgz is kept on branch "state-<device>"
      # Two devices may finish at the same moment, so pushes to the shared
      # "accounts" and "retired" branches are retried after pulling.
      - name: Archive, drop or keep the account
        if: always() && env.RETIRED != '1' && !inputs.fresh_start
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          OUT_DIR="${OUT_DIR:-$RUNNER_TEMP/out}"
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          field() { sed -n "s/.*\"$1\": \"\{0,1\}\([^\",}]*\).*/\1/p" "$2" 2>/dev/null || true; }
          STATUS="$(field status "$OUT_DIR/result.json")"
          END="$(field end_balance "$OUT_DIR/result.json")"
          echo "Device $DEVICE run status: ${STATUS:-none}, end balance: ${END:-unknown}"
          echo "${STATUS:-no_result}" > "$RUNNER_TEMP/final_status"
          drop_state() {  # delete this device's state branch (needs a local repo to push from)
            rm -rf drop && git init -q drop && { git -C drop push -q "$URL" --delete "state-$DEVICE" 2>/dev/null || true; }; rm -rf drop
          }
          commit_to() {  # commit_to <branch> <message> <function>: <function> writes into ./w
            local attempt   # plain push, never forced; retried on a fresh clone if the other device got there first
            for attempt in 1 2 3 4 5; do
              rm -rf w
              git clone -q --depth 1 --branch "$1" "$URL" w 2>/dev/null \
                || { mkdir w && git -C w init -q -b "$1" && git -C w remote add origin "$URL"; }
              "$3" && git -C w add -A && git -C w commit -q -m "$2" \
                && git -C w push -q origin "$1" && { rm -rf w; return 0; }
              echo "$1 branch changed under us (other device?), retry $attempt"; sleep $((attempt * 5))
            done
            rm -rf w; return 1
          }

          LOW=0
          if [ "$STATUS" = balance_zero ] || { [ -n "$END" ] && awk -v b="$END" 'BEGIN { exit !(b < 5) }'; }; then LOW=1; fi

          if [ "$STATUS" = target_reached ] && [ -f "$OUT_DIR/guest_state.tgz" ]; then
            NAME="$(date -u +%Y%m%d-%H%M%S)-device${DEVICE}-guest$(field guest_id "$OUT_DIR/result.json")-INR${END}"
            add_account() {
              [ -f w/index.csv ] || printf 'date,device,guest_id,balance,file,run\n' > w/index.csv
              mkdir -p w/accounts
              cp "$OUT_DIR/guest_state.tgz" "w/accounts/$NAME.tgz" && cp "$OUT_DIR/result.json" "w/accounts/$NAME.json"
              echo "$(date -u +%Y-%m-%d),$DEVICE,$(field guest_id "$OUT_DIR/result.json"),$END,accounts/$NAME.tgz,${GITHUB_RUN_ID}" >> w/index.csv
            }
            if commit_to accounts "Archive account from run ${GITHUB_RUN_ID}, device $DEVICE" add_account; then
              echo "Archived account accounts/$NAME.tgz"; drop_state
            else
              echo "Could not push to branch accounts; account kept on state-$DEVICE"; LOW=0; STATUS=keep
            fi
          fi

          if [ "$LOW" = 1 ]; then
            # Under 5 no coin fits: this guest is of no further use. Delete its
            # saved login and retire the device so it is not opened again.
            drop_state
            add_retired() {
              printf '{"date": "%s", "guest_id": "%s", "end_balance": "%s", "run": "%s"}\n' \
                "$(date -u +%Y-%m-%d)" "$(field guest_id "$OUT_DIR/result.json")" "$END" "$GITHUB_RUN_ID" > "w/device$DEVICE.json"
            }
            if commit_to retired "Retire device $DEVICE (balance ${END:-under 5}), run ${GITHUB_RUN_ID}" add_retired; then
              echo "Device $DEVICE retired; saved login deleted"
            else
              echo "Could not push to branch retired"
            fi
            echo "${STATUS:-balance_zero}, retired" > "$RUNNER_TEMP/final_status"
          elif [ "$STATUS" != target_reached ] && [ -f "$OUT_DIR/guest_state.tgz" ]; then
            rm -rf state-out && mkdir state-out && cp "$OUT_DIR/guest_state.tgz" state-out/
            # One commit only: the branch keeps just the current login.
            git -C state-out init -q -b "state-$DEVICE" && git -C state-out add guest_state.tgz \
              && git -C state-out commit -q -m "Device $DEVICE login from run ${GITHUB_RUN_ID}"
            git -C state-out push -q -f "$URL" "state-$DEVICE"
            rm -rf state-out
            echo "Device $DEVICE: account kept (${STATUS:-no status}); next run continues it"
          fi
          rm -f "$OUT_DIR/guest_state.tgz"

      # Both devices push their folder to the same branch, so the push is retried
      # after pulling if the other device got there first.
      - name: Save results to private repo (branch "results")
        if: always() && env.RETIRED != '1'
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          OUT_DIR="${OUT_DIR:-$RUNNER_TEMP/out}"; mkdir -p "$OUT_DIR"
          RUN_DIR="runs/$(date -u +%Y%m%d-%H%M%S)-${RUN_SCRIPT%.sh}-run${GITHUB_RUN_ID}-device${DEVICE}"
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          find "$OUT_DIR" -name "*.ocr-*.json" -delete
          rm -f "$OUT_DIR/guest_state.tgz"  # logins are never stored in results
          echo "Saving results to branch results, folder $RUN_DIR"
          for attempt in 1 2 3 4 5; do
            rm -rf results-repo
            if ! git clone -q --depth 1 --branch results "$URL" results-repo 2>/dev/null; then
              mkdir results-repo && git -C results-repo init -q -b results && git -C results-repo remote add origin "$URL"
            fi
            mkdir -p "results-repo/$RUN_DIR" && cp -r "$OUT_DIR"/. "results-repo/$RUN_DIR"/
            cp "$RUNNER_TEMP/workflow_log.txt" "results-repo/$RUN_DIR/"
            git -C results-repo add -A && git -C results-repo commit -q -m "Phase 1 results: $RUN_DIR"
            git -C results-repo push -q origin results && break
            echo "results branch changed under us (other device?), retry $attempt"; sleep $((attempt * 5))
          done

      # Keep only the newest 3 runs of this workflow in the Actions tab (this run
      # counts as one); older finished runs and their public logs are deleted.
      # Done by device 1 only.
      - name: Delete old runs (keep newest 3)
        if: always() && matrix.device == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec >>"$RUNNER_TEMP/workflow_log.txt" 2>&1
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-phase1.yml/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[3:][] | select(.status == "completed") | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" && echo "Deleted run $id"
            done

      # The only line this device prints to the public log and summary.
      - name: Status
        if: always()
        run: |
          if [ "${RETIRED:-0}" = 1 ]; then S="retired, skipped"
          elif [ -f "$RUNNER_TEMP/final_status" ]; then S="$(cat "$RUNNER_TEMP/final_status")"
          else S="$(sed -n 's/.*"status": "\([^"]*\)".*/\1/p' "$RUNNER_TEMP/out/result.json" 2>/dev/null)"; S="${S:-failed}"; fi
          [ "${{ inputs.fresh_start }}" = true ] && S="$S (fresh start)"
          echo "Device $DEVICE: $S" | tee -a "$GITHUB_STEP_SUMMARY"
