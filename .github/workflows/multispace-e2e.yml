name: 4bTech Space - end-to-end on Android (ARM)

# Builds 4bTech Space (debug) and its e2e guest app from the PRIVATE repo
# 4BornGithub/4B-Multi-Space and runs scripts/ci/e2e.sh against real ARM Android systems:
# Redroid (Android 8.1-15, arm64, running as a Docker container) on GitHub's free ARM
# runners. No emulator and no x86->ARM translation: the x86 emulator cannot run the
# engine's inline hooks (it crashes in libndk_translation), and GitHub's ARM runners have
# no KVM for the normal emulator. Each container gets a memory limit shaped like a low-end,
# mid or high-end phone. The guest app is cloned 3 times in the virtual engine and every
# copy must start fresh with its own data and its own Android ID.
# Screenshots, logcat and summary go to branch "results" of the private repo, folder
# runs/<time>-multispace-e2e-<device>-run<id>; only PASS/FAIL lines are printed here.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the private repo"
        required: false
        default: "main"
  push:
    paths:
      - .github/workflows/multispace-e2e.yml

permissions:
  contents: read

concurrency:
  group: multispace-e2e-${{ inputs.ref || 'main' }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: 4BornGithub/4B-Multi-Space
  PRIVATE_REF: ${{ inputs.ref || 'main' }}

jobs:
  build:
    name: build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      token: ${{ steps.token.outputs.name }}
    steps:
      # Tries each token secret (only names are printed) and uses the first one that can
      # read the private repo, preferring one that can also write (results, releases).
      - name: Pick a token for the private repo
        id: token
        env:
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          READ=""; WRITE=""
          for n in MULTISPACE_REPO_TOKEN PRIVATE_REPO_TOKEN PROJECTS_TOKEN; do
            v="${!n}"
            if [ -z "$v" ]; then echo "$n: not set"; continue; fi
            if git ls-remote "https://x-access-token:$v@github.com/$PRIVATE_REPO.git" HEAD >/dev/null 2>&1; then
              P="$(curl -fsS -H "Authorization: Bearer $v" "https://api.github.com/repos/$PRIVATE_REPO" | jq -r '.permissions.push // "unknown"')"
              echo "$n: can read $PRIVATE_REPO (write: $P)"
              [ -n "$READ" ] || READ=$n
              [ "$P" != true ] || [ -n "$WRITE" ] || WRITE=$n
            else
              echo "$n: no access to $PRIVATE_REPO"
            fi
          done
          PICK="${WRITE:-$READ}"
          [ -n "$PICK" ] || { echo "::error::No token secret can read $PRIVATE_REPO. Add MULTISPACE_REPO_TOKEN (fine-grained, Contents read+write on that repo)."; exit 1; }
          [ -n "$WRITE" ] || echo "::warning::$PICK can only read: results cannot be saved to $PRIVATE_REPO"
          echo "Using $PICK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "name=$PICK" >> "$GITHUB_OUTPUT"

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets[steps.token.outputs.name] }}
          path: private

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build app and guest (debug)
        working-directory: private
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066" >/dev/null
          if ! gradle --no-daemon --console=plain :app:assembleDebug :app:assembleRelease :testing:guest-app:assembleDebug >"$RUNNER_TEMP/build_log.txt" 2>&1; then
            grep -E "^e: |error:|What went wrong" -A3 "$RUNNER_TEMP/build_log.txt" | head -60
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/e2e"
          cp app/build/outputs/apk/debug/*universal*.apk "$RUNNER_TEMP/e2e/app.apk"
          cp app/build/outputs/apk/release/*universal*.apk "$RUNNER_TEMP/e2e/release.apk"
          cp testing/guest-app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/e2e/guest.apk"
          cp scripts/ci/e2e.sh scripts/ci/ui-tour.sh scripts/ci/save-results.sh "$RUNNER_TEMP/e2e/"

      # Kept inside this run only (deleted after 1 day); the private repo's release has the real builds.
      - uses: actions/upload-artifact@v4
        with:
          name: multispace-e2e-files
          path: ${{ runner.temp }}/e2e
          retention-days: 1

  e2e:
    name: ${{ matrix.device }}
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental }}
    env:
      # adb auto-scans port 5555 as "emulator-5554" and would then see the container twice.
      ANDROID_SERIAL: localhost:6000
    strategy:
      fail-fast: false
      matrix:
        include:
          # memory/cpus: Docker limits on the whole Android system, like a phone of that class.
          - { device: android8.1-low-2gb, image: "redroid/redroid:8.1.0-latest",  memory: 2g, cpus: 2, experimental: true }
          - { device: android9-low-2gb,   image: "redroid/redroid:9.0.0-latest",  memory: 2g, cpus: 2, experimental: true }
          - { device: android10-mid-3gb,  image: "redroid/redroid:10.0.0-latest", memory: 3g, cpus: 2, experimental: true }
          - { device: android11-low-2gb,  image: "redroid/redroid:11.0.0-latest", memory: 2g, cpus: 2, experimental: false }
          - { device: android11-high-6gb, image: "redroid/redroid:11.0.0-latest", memory: 6g, cpus: 4, experimental: false }
          - { device: android13-mid-4gb,  image: "redroid/redroid:13.0.0-latest", memory: 4g, cpus: 4, experimental: true }
          - { device: android15-high-6gb, image: "redroid/redroid:15.0.0-latest", memory: 6g, cpus: 4, experimental: true }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: multispace-e2e-files
          path: e2e

      - name: Start Android (Redroid, arm64)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb >/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || { echo "::error::binder kernel module not available on this runner"; exit 1; }
          sudo modprobe ashmem_linux 2>/dev/null || true
          docker pull -q ${{ matrix.image }} >/dev/null
          docker run -d --name android --privileged --memory=${{ matrix.memory }} --cpus=${{ matrix.cpus }} \
            -p 6000:5555 ${{ matrix.image }} androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true \
            androidboot.redroid_width=1080 androidboot.redroid_height=2280 androidboot.redroid_dpi=420
          for i in $(seq 1 84); do adb connect localhost:6000 >/dev/null 2>&1; [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != 1 ]; then
            # Diagnostics go to the results branch (the runner's own log is not readable from everywhere).
            { echo "== docker ps"; docker ps -a; echo "== adb devices"; adb devices; echo "== getprop"; adb shell getprop 2>&1 | head -40;
              echo "== docker logs"; docker logs android 2>&1 | tail -200; echo "== dmesg"; sudo dmesg 2>/dev/null | tail -60; } > "$RUNNER_TEMP/out/boot_failure.txt"
            echo "::error::Android did not boot in 7 minutes (see boot_failure.txt in the results)"; exit 1
          fi
          echo "Android $(adb shell getprop ro.build.version.release | tr -d '\r') booted, abis: $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"

      - name: Run the e2e test
        run: |
          bash e2e/e2e.sh e2e/app.apk e2e/guest.apk "$RUNNER_TEMP/out/${{ matrix.device }}" full e2e/release.apk > "$RUNNER_TEMP/out/e2e_console.txt" 2>&1 || touch "$RUNNER_TEMP/out/FAILED"
          docker logs android > "$RUNNER_TEMP/out/redroid_log.txt" 2>&1 || true
          docker stop android >/dev/null 2>&1 || true

      - name: Result
        if: always()
        run: |
          S="$RUNNER_TEMP/out/${{ matrix.device }}/summary.txt"
          { echo "### ${{ matrix.device }}"; echo '```'; grep -E "^(PASS|FAIL|== result)" "$S" 2>/dev/null | cut -c1-200 || echo "no summary (see results)"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save results to private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets[needs.build.outputs.token] }}
        run: set -o pipefail; bash e2e/save-results.sh "$RUNNER_TEMP/out" "e2e-${{ matrix.device }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if the test failed
        if: always()
        run: test ! -e "$RUNNER_TEMP/out/FAILED" && test ! -e "$RUNNER_TEMP/out/boot_failure.txt"

  # Human review: installs real open-source apps from F-Droid, clones them, opens the copies
  # and screenshots every screen of the app. Screens go to the results branch of the private
  # repo (runs/<time>-multispace-ui-tour-run<id>/ui-tour/*.png).
  ui-tour:
    name: UI tour (screenshots)
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    continue-on-error: true
    env:
      ANDROID_SERIAL: localhost:6000
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: multispace-e2e-files
          path: e2e

      - name: Download real apps (open-source releases on GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apps
          # <package>|<github repo>|<asset name filter>: the release APK of each open-source app.
          for spec in "org.fossify.calculator|FossifyOrg/Calculator|foss" "org.telegram.messenger|Telegram-FOSS-Team/Telegram-FOSS|arm64"; do
            P=${spec%%|*}; R=$(echo "$spec" | cut -d'|' -f2); F=${spec##*|}
            # Newest stable (non-prerelease) release with an APK matching the filter.
            URL=$(gh api "repos/$R/releases?per_page=15" --jq "[.[] | select(.prerelease==false) | .assets[] | select(.name|endswith(\".apk\")) | select(.name|test(\"$F\")) | .browser_download_url][0] // empty")
            [ -n "$URL" ] || URL=$(gh api "repos/$R/releases?per_page=15" --jq '[.[] | select(.prerelease==false) | .assets[] | select(.name|endswith(".apk")) | .browser_download_url][0] // empty')
            if [ -n "$URL" ] && curl -fsSL -o "apps/$P.apk" "$URL"; then echo "$P: $(basename "$URL") $(du -h apps/$P.apk | cut -f1)"; else echo "::warning::$P could not be downloaded"; fi
          done

      # The user's own app (release "APK" of the private repo Bhautik-4B/Game-Auto).
      - name: Download 4B-Rummy-Home (private release)
        env:
          GH_TOKEN: ${{ secrets[needs.build.outputs.token] }}
        run: |
          gh release download APK --repo Bhautik-4B/Game-Auto --pattern base.apk --dir "$RUNNER_TEMP/game" \
            && mv "$RUNNER_TEMP/game/base.apk" apps/4b-rummy-home.apk && echo "4B-Rummy-Home: $(du -h apps/4b-rummy-home.apk | cut -f1)" \
            || echo "::warning::4B-Rummy-Home could not be downloaded with the chosen token"

      - name: Start Android (Redroid, arm64)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb >/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || { echo "::error::binder kernel module not available on this runner"; exit 1; }
          sudo modprobe ashmem_linux 2>/dev/null || true
          docker pull -q redroid/redroid:11.0.0-latest >/dev/null
          docker run -d --name android --privileged --memory=6g --cpus=4 \
            -p 6000:5555 redroid/redroid:11.0.0-latest androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true \
            androidboot.redroid_width=1080 androidboot.redroid_height=2280 androidboot.redroid_dpi=420
          for i in $(seq 1 84); do adb connect localhost:6000 >/dev/null 2>&1; [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != 1 ]; then
            # Diagnostics go to the results branch (the runner's own log is not readable from everywhere).
            { echo "== docker ps"; docker ps -a; echo "== adb devices"; adb devices; echo "== getprop"; adb shell getprop 2>&1 | head -40;
              echo "== docker logs"; docker logs android 2>&1 | tail -200; echo "== dmesg"; sudo dmesg 2>/dev/null | tail -60; } > "$RUNNER_TEMP/out/boot_failure.txt"
            echo "::error::Android did not boot in 7 minutes (see boot_failure.txt in the results)"; exit 1
          fi
          echo "Android $(adb shell getprop ro.build.version.release | tr -d '\r') booted, abis: $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"

      - name: Run the UI tour
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ARGS=""
          for f in apps/*.apk; do [ -f "$f" ] && ARGS="$ARGS $f"; done
          bash e2e/ui-tour.sh e2e/app.apk "$RUNNER_TEMP/out/ui-tour" $ARGS > "$RUNNER_TEMP/out/tour_console.txt" 2>&1 || true
          { echo "### UI tour"; echo '```'; cat "$RUNNER_TEMP/out/ui-tour/notes.txt" 2>/dev/null | cut -c1-200; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          docker stop android >/dev/null 2>&1 || true

      - name: Save screenshots to private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets[needs.build.outputs.token] }}
        run: bash e2e/save-results.sh "$RUNNER_TEMP/out" ui-tour | tee -a "$GITHUB_STEP_SUMMARY"
