name: MultiSpace - end-to-end on Android (ARM)

# Builds 4B Multi Space (debug) and its e2e guest app from the PRIVATE repo
# 4BornGithub/4B-Multi-Space and runs scripts/ci/e2e.sh against real ARM Android systems:
# Redroid (Android 11-15, arm64, running as a Docker container) on GitHub's free ARM
# runners. No emulator and no x86->ARM translation: the x86 emulator cannot run the
# engine's inline hooks (it crashes in libndk_translation), and GitHub's ARM runners have
# no KVM for the normal emulator. Each container gets a memory limit shaped like a low-end,
# mid or high-end phone. The guest app is cloned 3 times in the virtual engine and every
# copy must start fresh with its own data and its own Android ID.
# Screenshots, logcat and summary go to branch "results" of the private repo, folder
# runs/<time>-multispace-e2e-<device>-run<id>; only PASS/FAIL lines are printed here.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the private repo"
        required: false
        default: "main"
  push:
    paths:
      - .github/workflows/multispace-e2e.yml

permissions:
  contents: read

concurrency:
  group: multispace-e2e-${{ inputs.ref || 'main' }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: 4BornGithub/4B-Multi-Space
  PRIVATE_REF: ${{ inputs.ref || 'main' }}

jobs:
  build:
    name: build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      token: ${{ steps.token.outputs.name }}
    steps:
      # Tries each token secret (only names are printed) and uses the first one that can
      # read the private repo, preferring one that can also write (results, releases).
      - name: Pick a token for the private repo
        id: token
        env:
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          READ=""; WRITE=""
          for n in MULTISPACE_REPO_TOKEN PRIVATE_REPO_TOKEN PROJECTS_TOKEN; do
            v="${!n}"
            if [ -z "$v" ]; then echo "$n: not set"; continue; fi
            if git ls-remote "https://x-access-token:$v@github.com/$PRIVATE_REPO.git" HEAD >/dev/null 2>&1; then
              P="$(curl -fsS -H "Authorization: Bearer $v" "https://api.github.com/repos/$PRIVATE_REPO" | jq -r '.permissions.push // "unknown"')"
              echo "$n: can read $PRIVATE_REPO (write: $P)"
              [ -n "$READ" ] || READ=$n
              [ "$P" != true ] || [ -n "$WRITE" ] || WRITE=$n
            else
              echo "$n: no access to $PRIVATE_REPO"
            fi
          done
          PICK="${WRITE:-$READ}"
          [ -n "$PICK" ] || { echo "::error::No token secret can read $PRIVATE_REPO. Add MULTISPACE_REPO_TOKEN (fine-grained, Contents read+write on that repo)."; exit 1; }
          [ -n "$WRITE" ] || echo "::warning::$PICK can only read: results cannot be saved to $PRIVATE_REPO"
          echo "Using $PICK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "name=$PICK" >> "$GITHUB_OUTPUT"

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets[steps.token.outputs.name] }}
          path: private

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build app and guest (debug)
        working-directory: private
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066" >/dev/null
          if ! gradle --no-daemon --console=plain :app:assembleDebug :testing:guest-app:assembleDebug >"$RUNNER_TEMP/build_log.txt" 2>&1; then
            grep -E "^e: |error:|What went wrong" -A3 "$RUNNER_TEMP/build_log.txt" | head -60
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/e2e"
          cp app/build/outputs/apk/debug/*universal*.apk "$RUNNER_TEMP/e2e/app.apk"
          cp testing/guest-app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/e2e/guest.apk"
          cp scripts/ci/e2e.sh scripts/ci/save-results.sh "$RUNNER_TEMP/e2e/"

      # Kept inside this run only (deleted after 1 day); the private repo's release has the real builds.
      - uses: actions/upload-artifact@v4
        with:
          name: multispace-e2e-files
          path: ${{ runner.temp }}/e2e
          retention-days: 1

  e2e:
    name: ${{ matrix.device }}
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # memory/cpus: Docker limits on the whole Android system, like a phone of that class.
          - { device: android11-low-2gb,  image: "redroid/redroid:11.0.0-latest", memory: 2g, cpus: 2, experimental: false }
          - { device: android11-high-6gb, image: "redroid/redroid:11.0.0-latest", memory: 6g, cpus: 4, experimental: false }
          - { device: android13-mid-4gb,  image: "redroid/redroid:13.0.0-latest", memory: 4g, cpus: 4, experimental: true }
          - { device: android15-high-6gb, image: "redroid/redroid:15.0.0-latest", memory: 6g, cpus: 4, experimental: true }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: multispace-e2e-files
          path: e2e

      - name: Start Android (Redroid, arm64)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb >/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || { echo "::error::binder kernel module not available on this runner"; exit 1; }
          sudo modprobe ashmem_linux 2>/dev/null || true
          docker run -d --name android --privileged --memory=${{ matrix.memory }} --cpus=${{ matrix.cpus }} \
            -p 5555:5555 ${{ matrix.image }} androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 androidboot.redroid_height=2280 androidboot.redroid_dpi=420
          for i in $(seq 1 60); do adb connect localhost:5555 >/dev/null 2>&1; [ "$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { echo "::error::Android did not boot in 5 minutes"; docker logs android | tail -40; exit 1; }
          echo "Android $(adb shell getprop ro.build.version.release | tr -d '\r') booted, abis: $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"

      - name: Run the e2e test
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          bash e2e/e2e.sh e2e/app.apk e2e/guest.apk "$RUNNER_TEMP/out/${{ matrix.device }}" full > "$RUNNER_TEMP/out/e2e_console.txt" 2>&1 || touch "$RUNNER_TEMP/out/FAILED"
          docker logs android > "$RUNNER_TEMP/out/redroid_log.txt" 2>&1 || true
          docker stop android >/dev/null 2>&1 || true

      - name: Result
        if: always()
        run: |
          S="$RUNNER_TEMP/out/${{ matrix.device }}/summary.txt"
          { echo "### ${{ matrix.device }}"; echo '```'; grep -E "^(PASS|FAIL|== result)" "$S" 2>/dev/null | cut -c1-200 || echo "no summary (see results)"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save results to private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets[needs.build.outputs.token] }}
        run: bash e2e/save-results.sh "$RUNNER_TEMP/out" "e2e-${{ matrix.device }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if the test failed
        if: always()
        run: test ! -e "$RUNNER_TEMP/out/FAILED"
