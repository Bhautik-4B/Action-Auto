name: Phone app pages (screenshots)

# Builds the phone app from the PRIVATE repo Bhautik-4B/Game-Auto (folder
# android-app) as a test build, opens every page on the emulator and takes
# screenshots (normal, large text, small screen): scripts/ui_tour.sh. Nothing
# is played and nothing is released. The screenshots go to branch "results" of
# the private repo, folder runs/<time>-uitour-run<id>.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ui-phone-apk.yml

permissions:
  contents: read

concurrency:
  group: ui-phone-apk
  cancel-in-progress: true

env:
  PRIVATE_REPO: Bhautik-4B/Game-Auto

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the app (test build)
        working-directory: private/android-app
        env:
          APP_ABIS: x86_64
        run: |
          if ! gradle --no-daemon --console=plain assembleRelease >"$RUNNER_TEMP/build_log.txt" 2>&1; then
            grep -E "^e: |error:|What went wrong|AAPT|ERROR" -A4 "$RUNNER_TEMP/build_log.txt" | head -80
            exit 1
          fi
          grep -E "^w: " "$RUNNER_TEMP/build_log.txt" | grep -v "/build/" | head -40 || true
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/phone-app.apk"

      - name: Open every page on the emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: false
          script: bash private/scripts/ui_tour.sh "$RUNNER_TEMP/phone-app.apk" "$RUNNER_TEMP/out"

      - name: Save screenshots to private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build_log.txt" "$RUNNER_TEMP/out/" 2>/dev/null || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RUN_DIR="runs/$(TZ=Asia/Kolkata date +%Y%m%d-%H%M%S)-uitour-run${GITHUB_RUN_ID}"
          URL="https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf results-repo
            git clone -q --depth 1 --filter=blob:none --no-checkout --branch results "$URL" results-repo
            git -C results-repo sparse-checkout set --no-cone "/$RUN_DIR/" && git -C results-repo checkout -q results
            mkdir -p "results-repo/$RUN_DIR" && cp -r "$RUNNER_TEMP/out"/. "results-repo/$RUN_DIR"/
            git -C results-repo add -A && git -C results-repo commit -q -m "Phone app page screenshots: $RUN_DIR"
            git -C results-repo push -q origin results && break
            sleep $((attempt * 5))
          done
          echo "Saved to $RUN_DIR" | tee -a "$GITHUB_STEP_SUMMARY"
