name: Build phone APK

# Builds the phone app (source: folder android-app of the PRIVATE repo
# Bhautik-4B/Game-Auto, reached with the PRIVATE_REPO_TOKEN secret) and
# publishes the APK as a release of this repo, for real ARM phones instead of
# the emulator. Click "Run workflow" (backend_url: the app saves to that
# backend; empty = the backend is off in the app).
# The APK is public here: anyone can download it.

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend address built into the app (https://...); empty = backend off"
        required: false
        default: ""
      qa:
        description: "QA build only: the APK is a download of this run (Artifacts), NOT a release. Phones never see it and no release is deleted."
        type: boolean
        default: false
      version:
        description: "Version 2.<minor>.<patch>, e.g. 2.1.1 (code 20000 + minor*100 + patch). Empty: the old 1.<run>.<attempt> numbering (only while no 2.x is released)."
        required: false
        default: ""

permissions:
  contents: write   # create the release

concurrency:
  group: build-phone-apk
  cancel-in-progress: false

env:
  PRIVATE_REPO: Bhautik-4B/Game-Auto

jobs:
  build:
    name: build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          # Same branch name as this run (main -> main, a test branch -> the
          # private repo's branch of the same name).
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # The version is 1.<run>.<attempt>, code <run> * 10 + <attempt>; the app
      # takes the release with the highest code and installs it only when it is
      # higher than its own. So every build must get a higher code than any
      # release there is: a re-run of an old run (run 6, attempt 7 = 67 after run
      # 7 = 71 had been released) is given the next run number instead.
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.version }}
        run: |
          # The highest released app code: phone-v1.<run>.<attempt> = run*10+attempt,
          # phone-v2.<minor>.<patch> = 20000 + minor*100 + patch (the app and the server read them the same way).
          MAX="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | awk -F'[v.]' '/^phone-v1\.[0-9]+\.[0-9]+$/ { c = $3 * 10 + $4 } /^phone-v2\.[0-9]+\.[0-9]+$/ { c = 20000 + $3 * 100 + $4 } { if (c > m) m = c; c = 0 } END { print m + 0 }')"
          if [ -n "$WANT" ]; then
            if ! echo "$WANT" | grep -Eq '^2\.[0-9]{1,2}\.[0-9]{1,2}$'; then echo "::error::version must be 2.<minor>.<patch> (minor, patch 0-99), not $WANT"; exit 1; fi
            MINOR="$(echo "$WANT" | cut -d. -f2)"; PATCH="$(echo "$WANT" | cut -d. -f3)"
            CODE=$((20000 + 10#$MINOR * 100 + 10#$PATCH)); NAME="2.$((10#$MINOR)).$((10#$PATCH))"
            # A release must be newer than every released one (QA builds may repeat a number).
            if [ "${{ inputs.qa }}" != true ] && [ "$CODE" -le "$MAX" ]; then echo "::error::$NAME (code $CODE) is not newer than the released code $MAX"; exit 1; fi
          else
            if [ "$MAX" -ge 20000 ]; then echo "::error::a 2.x version is released: give the version input (e.g. 2.1.2)"; exit 1; fi
            RUN=$GITHUB_RUN_NUMBER; ATTEMPT=$GITHUB_RUN_ATTEMPT
            if [ $((RUN * 10 + ATTEMPT)) -le "$MAX" ]; then
              echo "Run $RUN attempt $ATTEMPT would be version 1.$RUN.$ATTEMPT, not newer than the released code $MAX"
              RUN=$((MAX / 10 + 1)); ATTEMPT=1
            fi
            CODE=$((RUN * 10 + ATTEMPT)); NAME="1.$RUN.$ATTEMPT"
          fi
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME${{ inputs.qa && '-qa' || '' }}" >> "$GITHUB_ENV"
          echo "Building version $NAME (code $CODE; newest released code: $MAX)" | tee -a "$GITHUB_STEP_SUMMARY"

      # Full output goes to a file; only compile errors are shown here.
      - name: Build
        working-directory: private/android-app
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        run: |
          if ! gradle --no-daemon --console=plain assembleShellRelease >"$RUNNER_TEMP/build_log.txt" 2>&1; then
            grep -E "^e: |error:|What went wrong|FAILURE" -A4 "$RUNNER_TEMP/build_log.txt" | head -80
            exit 1
          fi
          ls -l app/build/outputs/apk/shell/release/

      # QA: only a download of this run. Phones look at releases only (Updater),
      # so a QA build never reaches users, and the live release stays.
      - name: QA APK (download, not a release)
        if: ${{ inputs.qa }}
        run: |
          mkdir -p "$RUNNER_TEMP/qa"
          cp private/android-app/app/build/outputs/apk/shell/release/app-shell-release.apk "$RUNNER_TEMP/qa/4B-Rummy-Home-$VERSION_NAME.apk"
          echo "QA build $VERSION_NAME: download it under Artifacts of this run. Not released." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload QA APK
        if: ${{ inputs.qa }}
        uses: actions/upload-artifact@v4
        with:
          name: 4B-Rummy-Home-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/qa/*.apk
          retention-days: 30
      # The same QA APK as a direct download link: a pre-release tagged qa-v...
      # Phones and the server only look at phone-v tags, so no phone ever sees it.
      - name: Publish QA APK as a direct link
        if: ${{ inputs.qa }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="qa-v$VERSION_NAME"
          gh release create "$TAG" "$RUNNER_TEMP"/qa/*.apk --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "QA $VERSION_NAME (test only, not for users)" \
            --notes "Test build from branch $GITHUB_REF_NAME. Phones do not update to it." || true
          echo "Direct link: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/4B-Rummy-Home-$VERSION_NAME.apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: ${{ !inputs.qa }}
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_URL: ${{ inputs.backend_url }}
        run: |
          TAG="phone-v$VERSION_NAME"
          APK="$RUNNER_TEMP/4B-Rummy-Home-$TAG.apk"
          cp private/android-app/app/build/outputs/apk/shell/release/app-shell-release.apk "$APK"
          # A build from a test branch is marked as a pre-release.
          PRE=""; [ "$GITHUB_REF_NAME" = main ] || PRE="--prerelease"
          # The tag goes on the default branch: GitHub refuses this token a tag on a
          # branch commit whose workflow files differ from it (HTTP 403).
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" $PRE \
            --title "4B-Rummy-Home $VERSION_NAME" \
            --notes "Android app for real ARM phones. Android 8 or newer. Install the APK, open 4B-Rummy-Home, follow the steps of Setup, then press Start. It updates itself when a new version comes out. Built from branch $GITHUB_REF_NAME.${BACKEND_URL:+ Backend: $BACKEND_URL}"
          echo "Released $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          # Only the newest app release is kept: the ones with a lower version
          # code (and their tags) are deleted. The app updates itself from the
          # newest one. (A higher one is never deleted, so a release can never
          # be replaced by an older version.)
          # Each one is kept first as backup-<tag> (a pre-release no phone or server
          # reads), so an older version can always be built or handed out again.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | awk -F'[v.]' '/^phone-v1\.[0-9]+\.[0-9]+$/ { print $0, $3 * 10 + $4 } /^phone-v2\.[0-9]+\.[0-9]+$/ { print $0, 20000 + $3 * 100 + $4 }' | while read -r OLD C; do
                [ "$C" -lt "$VERSION_CODE" ] || continue
                B="$RUNNER_TEMP/backup-$OLD"; mkdir -p "$B"
                if ! gh release view "backup-$OLD" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                  gh release download "$OLD" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$B" \
                    && gh release create "backup-$OLD" "$B"/*.apk --repo "$GITHUB_REPOSITORY" --prerelease \
                         --title "Backup of $OLD (not for phones)" --notes "The app as released under $OLD, kept when a newer version replaced it." \
                    || { echo "::warning::backup of $OLD failed: it is NOT deleted"; continue; }
                fi
                gh release delete "$OLD" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag && echo "Deleted old release $OLD (kept as backup-$OLD)"
              done || true
