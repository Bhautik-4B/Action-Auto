name: 4bTech Space - warm-up experiment

# Measurement for the "seed downloaded content" feature: on real ARM Android (Redroid),
# clones 4B-Rummy-Home 3 times, opens copy 1 and waits until its data folders stop
# changing (first-start download/unpack done), records the time and exactly which files
# appeared, then opens copy 3 unseeded to measure the repeat cost, and lists which files are
# byte-identical between copies (shareable content) and which differ (per-copy data).
# Results: branch "results" of the private repo, runs/<time>-multispace-experiment-run<id>/.

on:
  workflow_dispatch:
    inputs:
      max_wait:
        description: "Seconds to wait for a first start to settle"
        required: false
        default: "480"
  push:
    paths:
      - .github/workflows/multispace-experiment.yml

permissions:
  contents: read

env:
  PRIVATE_REPO: 4BornGithub/4B-Multi-Space
  DOWNLOAD_REPO: Bhautik-4B/Game-Auto

jobs:
  build:
    name: build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      token: ${{ steps.token.outputs.name }}
    steps:
      - name: Pick a token for the private repos
        id: token
        env:
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          for n in MULTISPACE_REPO_TOKEN PRIVATE_REPO_TOKEN PROJECTS_TOKEN; do
            v="${!n}"; [ -n "$v" ] || continue
            if git ls-remote "https://x-access-token:$v@github.com/$PRIVATE_REPO.git" HEAD >/dev/null 2>&1 \
               && git ls-remote "https://x-access-token:$v@github.com/$DOWNLOAD_REPO.git" HEAD >/dev/null 2>&1; then
              echo "Using $n" | tee -a "$GITHUB_STEP_SUMMARY"; echo "name=$n" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "::error::No token secret can read both repos"; exit 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets[steps.token.outputs.name] }}
          path: private
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        working-directory: private
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066" >/dev/null
          gradle --no-daemon --console=plain :app:assembleDebug >"$RUNNER_TEMP/build_log.txt" 2>&1 || { grep -E "^e: |error:|What went wrong" -A3 "$RUNNER_TEMP/build_log.txt" | head -40; exit 1; }
          mkdir -p "$RUNNER_TEMP/x"
          cp app/build/outputs/apk/debug/*universal*.apk "$RUNNER_TEMP/x/app.apk"
          cp scripts/ci/warmup-experiment.sh scripts/ci/save-results.sh "$RUNNER_TEMP/x/"
      - name: The game (private release)
        env:
          GH_TOKEN: ${{ secrets[steps.token.outputs.name] }}
        run: gh release download APK --repo "$DOWNLOAD_REPO" --pattern base.apk --dir "$RUNNER_TEMP/x" && mv "$RUNNER_TEMP/x/base.apk" "$RUNNER_TEMP/x/game.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: multispace-experiment-files
          path: ${{ runner.temp }}/x
          retention-days: 1

  experiment:
    name: measure on Android 11 (ARM)
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: localhost:6000
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: multispace-experiment-files
          path: x
      - name: Start Android (Redroid, arm64)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb >/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          docker pull -q redroid/redroid:11.0.0-latest >/dev/null
          docker run -d --name android --privileged --memory=6g --cpus=4 -p 6000:5555 redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true androidboot.redroid_width=1080 androidboot.redroid_height=2280 androidboot.redroid_dpi=420
          for i in $(seq 1 84); do adb connect localhost:6000 >/dev/null 2>&1; [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { echo "::error::Android did not boot"; exit 1; }
      - name: Run the experiment
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          bash x/warmup-experiment.sh x/app.apk x/game.apk "$RUNNER_TEMP/out/experiment" "${{ inputs.max_wait || '480' }}" > "$RUNNER_TEMP/out/console.txt" 2>&1 || true
          { echo "### Warm-up experiment"; echo '```'; cut -c1-200 "$RUNNER_TEMP/out/experiment/notes.txt"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          docker stop android >/dev/null 2>&1 || true
      - name: Save results to private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets[needs.build.outputs.token] }}
        run: set -o pipefail; bash x/save-results.sh "$RUNNER_TEMP/out" experiment | tee -a "$GITHUB_STEP_SUMMARY"
